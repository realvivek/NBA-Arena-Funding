# ------------------------------------------------------------------ who pays
- key: residents_share
  title: Share of public capital from taxes residents mostly pay
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer = 'residents'
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: General funds and general-obligation bonds, dedicated sales taxes, tax increment and other tax capture, lease-revenue bonds, and alcohol and tobacco taxes.

- key: visitors_share
  title: Share of public capital from taxes on visitors
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer = 'visitors'
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: Taxes on hotel rooms, car rentals, restaurant food and drink, and tickets.

- key: other_share
  title: Share of public capital given as land, or with no documented funding stream
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer = 'other'
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: visitors_public
  title: Public capital from taxes on visitors
  sql: |
    select sum(b.public_2026_m) from buckets b join capital c using (item_id) join bucket_groups g using (bucket)
    where g.payer = 'visitors'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

- key: hh_uta
  title: Salt Lake City's Delta Center deal per household in the city
  sql: select per_household_2026 from households where team = 'UTA' and share = 1
  check: select max(per_household_2026) = (select per_household_2026 from households where team = 'UTA') from households
  unit: usd
  basis: 2026 dollars per household; an upper bound
  label: a
  sources: [ledger, census-b11001-2024]
  sources_sql: select source_id from item_sources where item_id in ('UTA-renovation-3', 'UTA-project') and role = 'public' order by item_id, ord
  note: The arena's $525 million and the district's $375 million, over the city's households. People who live elsewhere pay part of the city's sales tax, so this is an upper bound.

- key: hh_okc
  title: Oklahoma City's arena money per household in the city
  sql: select per_household_2026 from households where team = 'OKC' and share = 1
  unit: usd
  basis: 2026 dollars per household
  label: a
  sources: [ledger, census-b11001-2024]
  note: The replacement arena and 2025 bond projects tied to it, plus the money for Paycom Center in 2002 and 2008.

- key: hh_was
  title: DC's money for Capital One Arena since 1997, per household
  sql: select per_household_2026 from households where team = 'WAS' and share = 1
  unit: usd
  basis: 2026 dollars per household
  label: a
  sources: [ledger, census-b11001-2024]

