- key: chi_formula
  title: Property tax the United Center did not pay under the 1989 formula, 2002-2016
  sql: select tax_break_cumulative_2026_m from arenas where team = 'CHI'
  unit: usd_m
  basis: 2026 dollars, each year deflated
  label: a
  sources: [uc-formula-method, ptaxsim-2024, ctu-2013]
  sources_sql: select source_id from arena_sources where row_type = 'current_arena' and team = 'CHI' and field in ('tax_break_source', 'property_tax_source') order by field, ord

- key: chi_formula_nominal
  title: The same, in the dollars of each year
  sql: select sum(saving_a) / 1e6 from uc_formula
  unit: usd_m
  digits: 1
  basis: nominal
  label: a
  sources: [uc-formula-method, ptaxsim-2024, ctu-2013]

- key: uc_formula_bill_min
  title: Lowest United Center tax bill under the formula, 2002-2016
  sql: select min(paid_with_floor) / 1e6 from uc_formula
  unit: usd_m
  digits: 1
  basis: nominal
  label: b/a
  sources: [uc-formula-method, ptaxsim-2024]
  note: The statute's $1 million minimum applied in 2005-2008.

