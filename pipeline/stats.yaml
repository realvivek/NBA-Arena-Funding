- key: finance_teams_n
  title: Teams with a controlling owner from finance or a current fund stake
  sql: |
    select count(*) from team_values v
    where v.owner_class <> 'other' or exists (select 1 from investors i where i.team = v.team and i.status = 'current')
  unit: count
  label: a
  sources: [team-ledger]

- key: finance_teams_public
  title: Public money, with tax breaks, in the arenas of teams with a controlling owner from finance or a current fund stake
  sql: |
    with t as (select v.team from team_values v
               where v.owner_class <> 'other' or exists (select 1 from investors i where i.team = v.team and i.status = 'current'))
    select (select sum(public_2026_m) from items where core and team in (select team from t))
         + (select sum(coalesce(pilot_2026_m, 0) + case when tax_break_in_expanded_total = 'Y' then tax_break_cumulative_2026_m else 0 end)
            from arenas where team in (select team from t))
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [team-ledger, ledger]

- key: finance_teams_share
  title: Share of all core public money held by the arenas of teams with a controlling owner from finance or a current fund stake
  sql: |
    with t as (select v.team from team_values v
               where v.owner_class <> 'other' or exists (select 1 from investors i where i.team = v.team and i.status = 'current'))
    select 100 * (select sum(public_2026_m) from items where core and team in (select team from t))
           / (select sum(public_2026_m) from items where core)
  check: |
    with t as (select v.team from team_values v
               where v.owner_class <> 'other' or exists (select 1 from investors i where i.team = v.team and i.status = 'current'))
    select (select sum(coalesce(pilot_2026_m, 0) + case when tax_break_in_expanded_total = 'Y' then tax_break_cumulative_2026_m else 0 end)
            from arenas where team in (select team from t)) = 0
  unit: pct
  digits: 0
  basis: share of 2026 dollars
  label: a
  sources: [team-ledger, ledger]
  note: The check confirms these arenas carry no tax breaks in the expanded total, so finance_teams_public equals their core public money. Their share of the league's teams is 53 percent. About half of the money ($2.44 billion by the ledger's year rule) was counted after the current finance owner or fund arrived, mostly the Salt Lake City, Washington, Detroit and Milwaukee deals.

- key: finance_teams_after
  title: Of the public money in the arenas of finance-owned or fund-held teams, the part counted after the current finance owner or fund arrived
  sql: |
    with ent as (
        select v.team,
               least(case when v.owner_class <> 'other' then v.control_year end,
                     (select min(cast(substr(i.entered, 1, 4) as integer)) from investors i
                      where i.team = v.team and i.status = 'current')) as entry
        from team_values v
        where v.owner_class <> 'other' or exists (select 1 from investors i where i.team = v.team and i.status = 'current'))
    select sum(i.public_2026_m) from items i join ent e using (team) where i.core and i.year >= e.entry
  check: |
    with ent as (
        select v.team,
               least(case when v.owner_class <> 'other' then v.control_year end,
                     (select min(cast(substr(i.entered, 1, 4) as integer)) from investors i
                      where i.team = v.team and i.status = 'current')) as entry
        from team_values v
        where v.owner_class <> 'other' or exists (select 1 from investors i where i.team = v.team and i.status = 'current')),
         a as (select sum(i.public_2026_m) filter (where i.year >= e.entry) as after, sum(i.public_2026_m) as all_
               from items i join ent e using (team) where i.core)
    select after / all_ between 0.4 and 0.6 from a
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [team-ledger, ledger]
  note: Items dated by the ledger's year rule (construction at opening, renovations at the middle year of the work, work under way at 2026). Entry is the year the current controlling owner from finance took control, or the first year a fund now holding a stake bought in, whichever came first; the Timberwolves' fund stake has no date and is left out. Mostly the Salt Lake City, Washington, Detroit and Milwaukee deals. The check confirms that it is about half.

- key: finance_teams_after_share
  title: The same money as a share of all the public money in those arenas
  sql: |
    with ent as (
        select v.team,
               least(case when v.owner_class <> 'other' then v.control_year end,
                     (select min(cast(substr(i.entered, 1, 4) as integer)) from investors i
                      where i.team = v.team and i.status = 'current')) as entry
        from team_values v
        where v.owner_class <> 'other' or exists (select 1 from investors i where i.team = v.team and i.status = 'current'))
    select 100 * sum(i.public_2026_m) filter (where i.year >= e.entry) / sum(i.public_2026_m)
    from items i join ent e using (team) where i.core
  unit: pct
  digits: 0
  basis: share of 2026 dollars
  label: a
  sources: [team-ledger, ledger]

