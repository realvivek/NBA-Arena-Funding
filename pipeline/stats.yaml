# ------------------------------------------------------------------ who pays
- key: residents_share
  title: Share of public capital from taxes residents mostly pay
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer = 'residents'
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: General funds and general-obligation bonds, dedicated sales taxes, tax increment and other tax capture, lease-revenue bonds, and alcohol and tobacco taxes.

- key: visitors_share
  title: Share of public capital from hotel and car-rental taxes, which fall mostly on visitors
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer = 'visitors'
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: Taxes on hotel rooms and car rentals. Restaurant-meal and ticket taxes, alone or pooled with hotel taxes, are counted apart (shared_share), because residents pay much of them. Part of a hotel tax may also fall on local hotel owners and workers; no incidence study for these arenas was found.

- key: shared_share
  title: Share of public capital from restaurant-meal and ticket taxes, alone or pooled with hotel taxes, which visitors and residents share
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer = 'shared'
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: Indianapolis's Capital Improvement Board taxes (hotel, food and beverage, and admissions taxes pooled), the Wisconsin Center District's room, food-and-beverage and car-rental taxes for Milwaukee's arena, and Washington's tax on arena tickets and merchandise. The records do not split these pooled streams by tax.

- key: visitors_shared_share
  title: Share of public capital from hotel, car-rental, restaurant-meal and ticket taxes together
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer in ('visitors', 'shared')
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: The upper bound for the money visitors paid; the lower bound is visitors_share.

- key: other_share
  title: Share of public capital given as land, or with no documented funding stream
  sql: |
    select 100 * sum(b.public_2026_m) / (select sum(public_2026_m) from capital)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where g.payer = 'other'
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: visitors_public
  title: Public capital from hotel and car-rental taxes
  sql: |
    select sum(b.public_2026_m) from buckets b join capital c using (item_id) join bucket_groups g using (bucket)
    where g.payer = 'visitors'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

# Who paid, before and since 2014. Items are dated as the ledger dates them: construction in the year the arena opened,
# renovations in the middle year of the work, purchases in the year of the sale, work still under way in 2026.
- key: visitors_share_before_2014
  title: Share of public capital dated before 2014 that came from hotel and car-rental taxes
  sql: |
    select 100 * sum(b.public_2026_m) filter (where g.payer = 'visitors') / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year < 2014
  check: |
    select max(s) filter (where payer = 'visitors') = max(s)
    from (select g.payer, sum(b.public_2026_m) as s from buckets b join capital c using (item_id)
          join bucket_groups g using (bucket) where c.year < 2014 group by g.payer)
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: Construction dated by the year the arena opened, renovations by the middle year of the work, purchases by the year of the sale. The check confirms that hotel and car-rental taxes were the largest source before 2014.

- key: residents_share_before_2014
  title: Share of public capital dated before 2014 that came from taxes residents mostly pay
  sql: |
    select 100 * sum(b.public_2026_m) filter (where g.payer = 'residents') / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year < 2014
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: other_share_before_2014
  title: Share of public capital dated before 2014 given as land, or not split by funding stream
  sql: |
    select 100 * sum(b.public_2026_m) filter (where g.payer = 'other') / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year < 2014
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: Mostly Memphis's arena bonds, repaid from several taxes and fees that the records do not split, and Cleveland's county bonds.

- key: residents_share_since_2014
  title: Share of public capital dated 2014 or later that came from taxes residents mostly pay
  sql: |
    select 100 * sum(b.public_2026_m) filter (where g.payer = 'residents') / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year >= 2014
  check: |
    select max(s) filter (where payer = 'residents') = max(s) and max(s) filter (where payer = 'residents') > sum(s) / 2
    from (select g.payer, sum(b.public_2026_m) as s from buckets b join capital c using (item_id)
          join bucket_groups g using (bucket) where c.year >= 2014 group by g.payer)
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: Led by Salt Lake City's arena sales tax and Washington's general fund. Work still under way is dated 2026. The check confirms that taxes residents mostly pay supplied more than half.

- key: visitors_share_since_2014
  title: Share of public capital dated 2014 or later that came from hotel and car-rental taxes
  sql: |
    select 100 * sum(b.public_2026_m) filter (where g.payer = 'visitors') / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year >= 2014
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: shared_share_before_2014
  title: Share of public capital dated before 2014 that came from restaurant-meal and ticket taxes, alone or pooled with hotel taxes
  sql: |
    select 100 * coalesce(sum(b.public_2026_m) filter (where g.payer = 'shared'), 0) / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year < 2014
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: shared_share_since_2014
  title: Share of public capital dated 2014 or later that came from restaurant-meal and ticket taxes, alone or pooled with hotel taxes
  sql: |
    select 100 * coalesce(sum(b.public_2026_m) filter (where g.payer = 'shared'), 0) / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year >= 2014
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: residents_share_since_2014_ex
  title: Share from taxes residents mostly pay since 2014, leaving out the Salt Lake City and Washington deals
  sql: |
    select 100 * sum(b.public_2026_m) filter (where g.payer = 'residents') / sum(b.public_2026_m)
    from buckets b join capital c using (item_id) join bucket_groups g using (bucket)
    where c.year >= 2014 and c.team not in ('UTA', 'WAS')
  check: |
    select (select 100 * sum(b.public_2026_m) filter (where g.payer = 'residents') / sum(b.public_2026_m)
            from buckets b join capital c using (item_id) join bucket_groups g using (bucket)
            where c.year >= 2014 and c.team not in ('UTA', 'WAS'))
         > (select 100 * sum(b.public_2026_m) filter (where g.payer = 'residents') / sum(b.public_2026_m)
            from buckets b join capital c using (item_id) join bucket_groups g using (bucket) where c.year < 2014)
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: A test of how much the shift depends on the two largest deals since 2014. The check confirms the share is still higher than before 2014.

- key: capital_before_2014
  title: Public capital in the 30 arenas dated before 2014
  sql: select sum(public_2026_m) from capital where year < 2014
  unit: usd_m
  basis: 2026 dollars
  label: a
