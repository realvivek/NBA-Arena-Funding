# Every number the site's copy uses. Each is a DuckDB query over pipeline/views.sql (or, rarely, a value entered by
# hand that the build confirms against the data), with a label and sources. The copy refers to them as {{key}}.
# Units: usd_m (millions of dollars), usd, pct (0-100), count, number, year. Labels: (a) computed, (b) primary
# document, (c) press or secondary. Aggregates over the ledger cite the ledger, which cites a source for every row.

stats:

# ------------------------------------------------------------------ the whole bill
- key: core_public
  title: Public money in the 30 current arenas
  sql: select sum(public_2026_m) from items where core
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]
  note: Construction, public purchases, completed or binding renovations, and yearly cash payments documented to date. Pending deals are not counted.

- key: total_spending
  title: All money spent on the 30 current arenas
  sql: select sum(spending_2026_m) from items where core
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]
  note: Construction (public and private), renovations (public and private) and public yearly payments. Public purchases count as public money but not as new spending, since they pay back private builders.

- key: public_share
  title: Public share of all arena spending
  sql: select 100 * sum(public_2026_m) / sum(spending_2026_m) from items where core
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: construction_public
  title: Public money for construction
  sql: select sum(public_2026_m) from items where core and kind = 'construction'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

- key: purchase_public
  title: Public money to buy existing arenas
  sql: select sum(public_2026_m) from items where core and kind = 'purchase'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]
  note: Minneapolis (1995), Portland (2024) and Washington (2024).

- key: renovation_public
  title: Public money for completed or binding renovations
  sql: select sum(public_2026_m) from items where core and kind = 'renovation'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

- key: ongoing_public
  title: Yearly public payments to teams or arena operators, documented to date
  sql: select sum(public_2026_m) from items where core and kind = 'ongoing'
  unit: usd_m
  basis: 2026 dollars, each payment at its year
  label: a
  sources: [ledger, fred-cpiaucns]

- key: ongoing_teams
  title: Teams with documented yearly public payments
  sql: select count(distinct team) from items where core and kind = 'ongoing'
  unit: count
  label: a
  sources: [ledger]

- key: capital_public
  title: Public capital money (construction, purchases, renovations)
  sql: select sum(public_2026_m) from capital
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

- key: expanded_public
  title: Public money including property-tax breaks and taxes diverted to arena debt
  sql: |
    select (select sum(public_2026_m) from items where core)
         + sum(coalesce(pilot_2026_m, 0))
         + sum(case when tax_break_in_expanded_total = 'Y' then tax_break_cumulative_2026_m else 0 end)
    from arenas
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger]
  note: Adds Barclays Center's PILOT bonds, Madison Square Garden's property-tax exemption (the Independent Budget Office's estimate for fiscal 1984-2023, converted from 2023 dollars, plus the Department of Finance's values for fiscal 2024-2026) and the United Center's valuation formula, 2002-2016. The breaks are low estimates, because the Garden's first two years and the United Center's 1994-2001 years could not be computed.

- key: expanded_share
  title: Public share with tax breaks added to both sides
  sql: |
    select 100 * ((select sum(public_2026_m) from items where core) + sum(coalesce(pilot_2026_m, 0))
                  + sum(case when tax_break_in_expanded_total = 'Y' then tax_break_cumulative_2026_m else 0 end))
         / ((select sum(spending_2026_m) from items where core)
            + sum(case when tax_break_in_expanded_total = 'Y' then tax_break_cumulative_2026_m else 0 end))
    from arenas
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: The PILOT bonds already sit inside Barclays Center's construction cost, so only the other breaks are added to the spending base.

- key: arenas_n
  title: Current NBA arenas
  sql: select count(*) from arenas
  unit: count
  label: a
  sources: [ledger]

- key: top10_share
  title: Share of public money in the 10 arenas with the most
  sql: |
    with t as (select team, sum(public_2026_m) p from items where core group by team order by p desc limit 10)
    select 100 * sum(p) / (select sum(public_2026_m) from items where core) from t
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: top_n
  title: Arenas in the top group
  sql: select 10
  unit: count
  label: a
  sources: [ledger]
  note: The size of the group in top10_share.

- key: ind_public
  title: Direct public money in Indianapolis's Gainbridge Fieldhouse, the most of any arena (tax breaks and the Barclays Center PILOT bonds not counted)
  sql: select sum(public_2026_m) from items where core and team = 'IND'
  check: select (select team from items where core group by team order by sum(public_2026_m) desc limit 1) = 'IND'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger]
  sources_sql: select source_id from item_sources where team = 'IND' and role = 'public' order by item_id, ord
  note: Construction (press), renovations and capital obligations under the 2014 and 2019 agreements (the Capital Improvement Board's statements) and yearly payments, 2001 and 2014-2025.

- key: ind_share
  title: Public share of all spending on Gainbridge Fieldhouse
  sql: select 100 * sum(public_2026_m) / sum(spending_2026_m) from items where core and team = 'IND'
  unit: pct
  digits: 0
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: orl_public
  title: Public money in Orlando's Kia Center
  sql: select sum(public_2026_m) from items where core and team = 'ORL'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger]
  sources_sql: select source_id from item_sources where team = 'ORL' and role = 'public' order by item_id, ord

- key: orl_share
  title: Public share of all spending on the Kia Center
  sql: select 100 * sum(public_2026_m) / sum(spending_2026_m) from items where core and team = 'ORL'
  unit: pct
  digits: 0
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: costliest_private_n
  title: The costliest arenas, in a row, that were built mainly with private money
  sql: |
    with r as (select team, built_privately_majority = 'Y' as p,
                      row_number() over (order by construction_cost_2026_m desc) as rn from arenas)
    select min(rn) - 1 from r where not p
  unit: count
  label: a
  sources: [ledger]
  note: Arenas ranked by construction cost in 2026 dollars; Intuit Dome and Chase Center. The third, Barclays Center, was built mainly with public money once its PILOT bonds count as public building money (bkn_build_share); the next five (Little Caesars Arena, Madison Square Garden, American Airlines Center, Golden 1 Center and Crypto.com Arena) were built mainly with private money. Kept for the record; not in the copy.

- key: costliest_public_n
  title: Of those costliest arenas, the ones that got public money
  sql: |
    with r as (select team, built_privately_majority = 'Y' as p,
                      row_number() over (order by construction_cost_2026_m desc) as rn from arenas),
         top as (select team from r where rn < (select min(rn) from r where not p))
    select count(*) from (select team from items where core and team in (select team from top)
                          group by team having sum(public_2026_m) > 0)
  unit: count
  label: a
  sources: [ledger]
  note: Chase Center (transit capital only). Kept for the record; not in the copy.

- key: costliest_public_min
  title: Least public money among those that got some
  sql: |
    with r as (select team, built_privately_majority = 'Y' as p,
                      row_number() over (order by construction_cost_2026_m desc) as rn from arenas),
         top as (select team from r where rn < (select min(rn) from r where not p)),
         m as (select team, sum(public_2026_m) v from items where core and team in (select team from top) group by team)
    select min(v) from m where v > 0
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

- key: costliest_public_max
  title: Most public money among those that got some
  sql: |
    with r as (select team, built_privately_majority = 'Y' as p,
                      row_number() over (order by construction_cost_2026_m desc) as rn from arenas),
         top as (select team from r where rn < (select min(rn) from r where not p)),
         m as (select team, sum(public_2026_m) v from items where core and team in (select team from top) group by team)
    select max(v) from m
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

- key: private_built_n
  title: Arenas built mainly with private money
  sql: select count(*) from arenas where built_privately_majority = 'Y'
  unit: count
  label: a
  sources: [ledger]
  note: Public money was under half of the construction cost. Barclays Center's PILOT bonds count as public building money for this test, as in the bill, so Brooklyn's arena is not in the group (bkn_build_share). Indianapolis's arena is in neither group, because its sources conflict (the Capital Improvement Board says $230.7 million of tax-backed 1997 bonds funded its construction and a garage, more than the $183 million reported cost) and no primary split was found.

- key: bkn_build_share
  title: Public share of Barclays Center's construction, counting the PILOT bonds as public building money
  sql: |
    select 100 * (public_construction_nominal_m + pilot_or_tax_diversion_financing_m)
           / greatest(construction_cost_nominal_m, public_construction_nominal_m + private_construction_nominal_m)
    from arenas where team = 'BKN'
  check: select built_privately_majority = 'N' from arenas where team = 'BKN'
  unit: pct
  digits: 0
  basis: share of nominal construction money
  label: a
  sources: [ledger, ibo-2023-march-description-of-public-subsidies-for-m]
  note: City and state capital ($315 million, outside the developer's reported cost) plus $511 million of PILOT bonds, over the $950.7 million reported cost plus the public capital. Without the bonds the public share is 25 percent.

# ------------------------------------------------------------------ building versus rebuilding
- key: rebuild_since_2014
  title: Public money to renovate or buy existing arenas since 2014
  sql: select sum(public_2026_m) from items where core and kind in ('renovation', 'purchase') and year >= 2014
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]
  note: Completed or binding. Renovations at their mid-construction year, work still under way at face value, purchases at the purchase year.

- key: build_since_2014
  title: Public money to build new arenas since 2014, including Oklahoma City's arena under construction
  sql: |
    select sum(public_2026_m) from items
    where (core and kind = 'construction' and year >= 2014)
       or (kind = 'project' and status = 'binding' and description not ilike '%district%')
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]
  note: Sacramento (2016), Detroit (2017), Milwaukee (2018) and the transit work for Chase Center (2019), at their opening years, plus Oklahoma City's replacement arena, binding and under construction, at face value, so both sides count money committed since 2014. Intuit Dome (2024) had no public construction money. San Antonio's arena money is not binding yet and is left out, as pending renovation money is on the other side.

- key: build_opened_since_2014
  title: Public money in the arenas that opened since 2014
  sql: select sum(public_2026_m) from items where core and kind = 'construction' and year >= 2014
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]
  note: Sacramento (2016), Detroit (2017), Milwaukee (2018) and the transit work for Chase Center (2019), at their opening years.

- key: rebuild_ratio
  title: Rebuilding money as a multiple of building money, since 2014
  sql: |
    select (select sum(public_2026_m) from items where core and kind in ('renovation', 'purchase') and year >= 2014)
         / (select sum(public_2026_m) from items
            where (core and kind = 'construction' and year >= 2014)
               or (kind = 'project' and status = 'binding' and description not ilike '%district%'))
  unit: number
  digits: 1
  label: a
  sources: [ledger]

- key: underway_public
  title: Renovation money counted at face value because the work is still under way or the money is still to be paid
  sql: select sum(public_2026_m) from items where core and kind = 'renovation' and year = 2026
  unit: usd_m
  basis: face value
  label: a
  sources: [ledger]
  note: Salt Lake City's 2025 renovation, Washington's 2024 deal, Orlando's 2024 package, Indianapolis's technology money to 2034, Memphis's first phase, Phoenix's renewal and replacement deposits, and Salt Lake City's reimbursement of a 2017 renovation through 2040.

- key: arenas_opened_1990_2005
  title: Current arenas that opened between 1990 and 2005
  sql: select count(*) from arenas where cast(opened as integer) between 1990 and 2005
  unit: count
  label: a
  sources: [ledger]
  note: Of the rest, Madison Square Garden opened in 1968 and seven opened from 2010 on.

- key: rebuild_ratio_with_sas
  title: The same multiple, counting Bexar County's voter-approved money for a new San Antonio arena with the new arenas
  sql: |
    select (select sum(public_2026_m) from items where core and kind in ('renovation', 'purchase') and year >= 2014)
         / (select sum(public_2026_m) from items
            where (core and kind = 'construction' and year >= 2014)
               or (kind = 'project' and status = 'binding' and description not ilike '%district%')
               or item_id = 'SAS-project')
  unit: number
  digits: 1
  label: a
  sources: [ledger]
  note: Bexar County's money is approved by voters but not yet binding, because the city's share and the definitive agreements are pending.

- key: opened_public_since_2014
  title: Arenas opened since 2014 with public construction money
  sql: select count(*) from items where core and kind = 'construction' and year >= 2014 and public_2026_m > 0
  unit: count
  label: a
  sources: [ledger]

- key: rebuild_arenas_since_2014
  title: Existing arenas that got public money to renovate or buy them since 2014
  sql: select count(distinct team) from items where core and kind in ('renovation', 'purchase') and year >= 2014 and public_2026_m > 0
  unit: count
  label: a
  sources: [ledger]

- key: rebuild_top3_min
  title: Least of the three largest totals put into one existing arena since 2014
  sql: |
    select min(v) from (select team, sum(public_2026_m) v from items
                        where core and kind in ('renovation', 'purchase') and year >= 2014
                        group by team order by v desc limit 3)
  check: |
    select list_sort(list(team)) = ['IND', 'UTA', 'WAS']
    from (select team, sum(public_2026_m) v from items where core and kind in ('renovation', 'purchase') and year >= 2014
          group by team order by v desc limit 3)
  unit: usd_m
  basis: 2026 dollars; work still under way at face value
  label: a
  sources: [ledger]
  note: Indianapolis (the 2014 and 2019 agreements), Salt Lake City (the 2017 reimbursement and the 2025 renovation) and Washington (the 2024 purchase and renovation). The check confirms the three.

- key: uta_renovation_multiple
  title: Salt Lake City's public renovation money as a multiple of what the Delta Center cost to build
  sql: |
    select (select public_2026_m from items where item_id = 'UTA-renovation-3')
         / (select spending_2026_m from items where item_id = 'UTA-construction')
  unit: number
  digits: 1
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]
  sources_sql: select source_id from item_sources where item_id in ('UTA-renovation-3', 'UTA-construction') order by item_id, role, ord
  note: The 2025 renovation's $525 million of city sales-tax money against the arena's 1991 construction cost, both in 2026 dollars. Construction costs have risen faster than consumer prices, so in construction terms the multiple would be smaller.

- key: renovations_over_cost_n
  title: Renovations with public money since 2014 that cost more than their arena did to build
  sql: |
    select count(*) from items r join items b on b.team = r.team and b.kind = 'construction' and b.core
    where r.core and r.kind = 'renovation' and r.year >= 2014 and r.public_2026_m > 0 and r.spending_2026_m > b.spending_2026_m
  check: |
    select list(r.team order by r.team) = ['IND', 'PHX', 'UTA', 'WAS']
    from items r join items b on b.team = r.team and b.kind = 'construction' and b.core
    where r.core and r.kind = 'renovation' and r.year >= 2014 and r.public_2026_m > 0 and r.spending_2026_m > b.spending_2026_m
  unit: count
  label: a
  sources: [ledger]
  note: Both in 2026 dollars, converted with consumer prices. Construction costs have risen faster than consumer prices, so a construction cost index would shrink these multiples. The check confirms the four are Indianapolis, Phoenix, Salt Lake City and Washington.

- key: pending_existing
  title: Public money pending for current arenas
  sql: select sum(public_2026_m) from items where kind = 'renovation' and status = 'pending'
  unit: usd_m
  basis: face value
  label: a
  sources: [ledger]
  note: Houston, Memphis and Portland. Not counted in the totals.

- key: new_arenas_committed
  title: Public money committed or approved for new arenas not yet open
  sql: select sum(public_2026_m) from items where kind = 'project' and team in ('OKC', 'SAS') and status <> 'pending'
  unit: usd_m
  basis: face value
  label: a
  sources: [ledger]
  sources_sql: select source_id from item_sources where item_id in ('OKC-project', 'SAS-project') and role = 'public' order by item_id, ord
  note: Oklahoma City's replacement arena (binding) and Bexar County's voter-approved share of a San Antonio arena. Outside the 30-arena totals.

- key: okc_new_arena
  title: Public money for Oklahoma City's replacement arena
  sql: select public_2026_m from items where item_id = 'OKC-project'
  unit: usd_m
  basis: face value
  label_sql: select public_label from items where item_id = 'OKC-project'
  sources_sql: select source_id from item_sources where item_id = 'OKC-project' and role = 'public' order by ord

- key: sas_county
  title: Bexar County's voter-approved money for a new Spurs arena
  sql: select public_2026_m from items where item_id = 'SAS-project'
  unit: usd_m
  basis: face value
  label_sql: select public_label from items where item_id = 'SAS-project'
  sources_sql: select source_id from item_sources where item_id = 'SAS-project' and role = 'public' order by ord

- key: sas_tirz
  title: Midtown tax-increment debt the San Antonio council approved on Sept. 10, 2026 to buy the arena site, inside the city's pending money
  sql: select public_nominal_m from buckets where item_id = 'SAS-project-pending' and bucket = 'tif'
  unit: usd_m
  basis: face value
  label_sql: select public_label from items where item_id = 'SAS-project-pending'
  sources_sql: select source_id from item_sources where item_id = 'SAS-project-pending' and role = 'public' order by ord
  note: Up to $60 million, more than $115 million with financing; the final financing plan returns to the council.

- key: sas_county_cap_pct
  title: Cap on Bexar County's money as a share of the arena's cost
  value: 25
  evidence: {file: data/ledger/ledger_items.csv, where: {item_id: SAS-project}, column: note, contains: 'or 25% of the cost, whichever is lower'}
  unit: pct
  digits: 0
  basis: whichever is lower
  label: c
  sources_sql: select source_id from item_sources where item_id = 'SAS-project' and role = 'public' order by ord

- key: sas_pending
  title: San Antonio city money for a new Spurs arena, pending
  sql: select public_2026_m from items where item_id = 'SAS-project-pending'
  unit: usd_m
  basis: face value
  label_sql: select public_label from items where item_id = 'SAS-project-pending'
  sources_sql: select source_id from item_sources where item_id = 'SAS-project-pending' and role = 'public' order by ord

- key: uta_district
  title: Salt Lake City sales-tax money for the district around the Delta Center
  sql: select public_2026_m from items where item_id = 'UTA-project'
  unit: usd_m
  basis: face value
  label_sql: select public_label from items where item_id = 'UTA-project'
  sources_sql: select source_id from item_sources where item_id = 'UTA-project' and role = 'public' order by ord

# ------------------------------------------------------------------ the 2024-26 deals
- key: uta_arena_2025
