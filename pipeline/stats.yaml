  label_sql: select public_label from items where item_id = 'WAS-purchase'
  sources_sql: select source_id from item_sources where item_id = 'WAS-purchase' and role = 'public' order by ord
  note: Under the Downtown Arena Revitalization Act of 2024. The totals count it in 2026 dollars, about $92.5 million.

