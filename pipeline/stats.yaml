- key: was_exemption_future
  title: Value of DC's property-tax exemption for Capital One Arena, fiscal 2025-2050
  sql: select tax_break_future_committed_m from arenas where team = 'WAS'
  unit: usd_m
  digits: 1
  basis: future years, as valued by DC's chief financial officer
  label: b
  sources_sql: select source_id from arena_sources where row_type = 'current_arena' and team = 'WAS' and field = 'tax_break_source' order by ord
  note: $49.8 million for fiscal 2025-2028 and $262.9 million for fiscal 2029-2050 (Table 1). Not added to any total.

- key: den_seat_tax_memo
  title: Ball Arena's exemption from Denver's seat tax, 1999-2023 (memo)
  sql: select tax_break_memo_estimate_m from arenas where team = 'DEN'
  unit: usd_m
  basis: nominal; one press figure
  label: c
  sources_sql: select source_id from arena_sources where row_type = 'current_arena' and team = 'DEN' and field = 'tax_break_source' order by ord
  note: Not added to any total; the press figure could not be opened.

- key: fed_bond_cost
  title: Federal cost of tax-exempt arena bonds
  sql: select sum(fed_tax_expenditure_pv_2026_m) from arenas
  unit: usd_m
  basis: present value at issue, in 2026 dollars
  label: a
  sources: [ledger, gayer-2016]
  note: New-money bond issues only, at a 28 percent marginal tax rate (the Gayer, Drukker and Gold method). Paid by all U.S. taxpayers; not added to any total.

- key: fed_tau
  title: Marginal tax rate used for the federal cost of tax-exempt bonds
  sql: select 100 * min(tau) from fed_bond_cost
  unit: pct
  digits: 0
  label: a
  sources: [gayer-2016]
  note: The lower of the two rates in the bond file; the 35 percent rate is shown there as a sensitivity.

- key: tax_breaks_added
  title: Tax breaks added to the expanded total
  sql: |
    select (select sum(coalesce(pilot_2026_m, 0)) from arenas)
         + (select sum(tax_break_cumulative_2026_m) from arenas where tax_break_in_expanded_total = 'Y')
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger]

