# ------------------------------------------------------------------ built privately, rebuilt publicly
- key: takeover_n
  title: Arenas built mainly with private money that were later bought or rebuilt with public money
  sql: |
    select count(distinct i.team) from items i join arenas a using (team)
    where a.built_privately_majority = 'Y' and i.kind in ('renovation', 'purchase') and (i.core or i.status = 'pending')
      and i.public_2026_m > 0
  unit: count
  label: a
  sources: [ledger]

- key: takeover_public
  title: Public money to buy or rebuild arenas built mainly with private money
  sql: |
    select sum(i.public_2026_m) from items i join arenas a using (team)
    where a.built_privately_majority = 'Y' and i.kind in ('renovation', 'purchase') and (i.core or i.status = 'pending')
  unit: usd_m
  basis: 2026 dollars; pending money at face value
  label: a
  sources: [ledger, fred-cpiaucns]

- key: takeover_pending
  title: Of that, pending
  sql: |
    select sum(i.public_2026_m) from items i join arenas a using (team)
    where a.built_privately_majority = 'Y' and i.kind = 'renovation' and i.status = 'pending'
  unit: usd_m
  basis: face value
  label: a
  sources: [ledger]

- key: takeover_construction_public
  title: Public money in the construction of those arenas
  sql: |
    select sum(i.public_2026_m) from items i join arenas a using (team)
    where a.built_privately_majority = 'Y' and i.kind = 'construction'
      and i.team in (select team from items where kind in ('renovation', 'purchase') and (core or status = 'pending') and public_2026_m > 0)
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

