# ------------------------------------------------------------------ other estimates
# Bradbury's venue database (built on Long's 2013 compilation for arenas opened through 2010) against the ledger's
# public construction money, arena by arena, each converted from the opening year with the ledger's CPI factors.
- key: bradbury_public_2026
  title: Public construction money in the 30 arenas in J.C. Bradbury's 2026 venue database, in 2026 dollars
  sql: |
    select sum(public_nominal_m * (select factor_2026 from cpi where cpi.year = opened))
    from outside_estimates where estimate = 'bradbury-2026'
  check: select count(*) = 30 and count(distinct team) = 30 from outside_estimates where estimate = 'bradbury-2026'
  unit: usd_m
  basis: 2026 dollars
  label: c/a
  sources: [bradbury-2026-venue-database, fred-cpiaucns]
  note: Construction only, including land and infrastructure where reported. Each arena's nominal figure converted from its opening year with the ledger's factors; converting Bradbury's 2024-dollar total instead gives $5.33 billion as well.

- key: bradbury_compared_n
  title: Arenas with public construction money in either the ledger or Bradbury's database
  sql: |
    with o as (select team, public_nominal_m * (select factor_2026 from cpi where cpi.year = opened) as b
               from outside_estimates where estimate = 'bradbury-2026'),
         l as (select team, public_2026_m as l from items where kind = 'construction' and core)
    select count(*) from o join l using (team) where o.b > 0 or l.l > 0
  unit: count
  label: a
  sources: [bradbury-2026-venue-database, ledger]

- key: bradbury_gap_n
  title: Of those, arenas where the two figures differ by more than a tenth of the larger one
  sql: |
    with o as (select team, public_nominal_m * (select factor_2026 from cpi where cpi.year = opened) as b
               from outside_estimates where estimate = 'bradbury-2026'),
         l as (select team, public_2026_m as l from items where kind = 'construction' and core)
    select count(*) from o join l using (team) where (o.b > 0 or l.l > 0) and abs(l.l - o.b) > 0.1 * greatest(l.l, o.b)
  unit: count
  label: a
  sources: [bradbury-2026-venue-database, ledger]
  note: The largest gaps are Barclays Center (Bradbury counts part of the bonds repaid with the arena's property taxes as construction money; the ledger keeps all of them in its expanded total), Indianapolis and Atlanta (bonds the ledger treats as repaid by the team or whose split is unresolved), and Washington, Los Angeles, Denver, Portland, Miami and Golden State, where the ledger counts land, site work or transit that the database does not. Arenas where the ledger is higher add up to $928 million and arenas where it is lower to $867 million.

- key: non_construction_public
  title: Public money in the 30 arenas other than construction (purchases, renovations and yearly payments)
  sql: select sum(public_2026_m) from items where core and kind <> 'construction'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, fred-cpiaucns]

