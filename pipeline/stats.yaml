# ------------------------------------------------------------------ threats
- key: threat_episodes
  title: Episodes in the threat ledger
  sql: select count(*) from threats
  unit: count
  label: a
  sources: [threat-ledger]

- key: threats_counted
  title: Explicit or implied relocation threats by owners or the league
  sql: select v from comparison where k = 'episodes_explicit_or_implied'
  check: select count(*) = (select v from comparison where k = 'episodes_explicit_or_implied') from threats where threat_class in ('explicit', 'implied')
  unit: count
  label: a
  sources: [threat-ledger]

- key: threats_same_city
  title: Threats followed by public money in the same city
  sql: select v from comparison where k = 'same_city_money.n'
  unit: count
  label: a
  sources: [threat-ledger]

- key: threats_team_left
  title: Threats after which the team left
  sql: select v from comparison where k = 'team_left.n'
  unit: count
  label: a
  sources: [threat-ledger]

- key: lag_median
  title: Median months from a threat to the approval of public money
  sql: select v from comparison where k = 'lag_median'
  unit: number
  digits: 1
  basis: months
  label: a
  sources: [threat-ledger]

- key: lag_n
  title: Threats with dated approvals in the same city
  sql: select v from comparison where k = 'lag_months.n'
  unit: count
  label: a
  sources: [threat-ledger]

- key: lag_within_24
  title: Of those, approvals within 24 months
  sql: select v from comparison where k = 'lag_within_24'
  unit: count
  label: a
  sources: [threat-ledger]

- key: lag_window
  title: Window used to count approvals that came soon after a threat
  sql: select v from comparison where k = 'lag_window_months'
  unit: count
  basis: months
  label: a
  sources: [threat-ledger]

- key: threat_deals_n
  title: Deals that followed a threat
  sql: select v from comparison where k = 'threat.n'
  unit: count
  label: a
  sources: [threat-ledger]

- key: nothreat_deals_n
  title: Deals with no threat
  sql: select v from comparison where k = 'no_threat.n'
  unit: count
  label: a
  sources: [threat-ledger]

- key: threat_median_share
  title: Median public share of deals that followed a threat
  sql: select 100 * v from comparison where k = 'threat.median_share'
  unit: pct
  digits: 0
  label: a
  sources: [threat-ledger]

- key: nothreat_median_share
  title: Median public share of deals with no threat
  sql: select 100 * v from comparison where k = 'no_threat.median_share'
  unit: pct
  digits: 0
  label: a
  sources: [threat-ledger]

- key: threat_median_public
  title: Median public money in deals that followed a threat
  sql: select v * (select factor_2026 from cpi where year = 2025) from comparison where k = 'threat.median_public_m_2025'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [threat-ledger, fred-cpiaucns]

- key: nothreat_median_public
  title: Median public money in deals with no threat
  sql: select v * (select factor_2026 from cpi where year = 2025) from comparison where k = 'no_threat.median_public_m_2025'
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [threat-ledger, fred-cpiaucns]

- key: p_share
  title: Chance of a difference in public share at least this large if threats made no difference
  sql: select v from comparison where k = 'p_share'
  unit: number
  digits: 2
  basis: two-sided Mann-Whitney U test
  label: a
  sources: [threat-ledger]

- key: p_dollars
  title: The same test for public money
  sql: select v from comparison where k = 'p_dollars'
  unit: number
  digits: 2
  basis: two-sided Mann-Whitney U test
  label: a
  sources: [threat-ledger]

