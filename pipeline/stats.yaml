# ------------------------------------------------------------------ the lead graphic
- key: construction_share
  title: Building's share of public money, counting tax breaks and Barclays Center's PILOT bonds as building money
  sql: |
    select 100 * ((select sum(public_2026_m) from items where core and kind = 'construction')
                  + (select sum(coalesce(pilot_2026_m, 0)) from arenas))
         / ((select sum(public_2026_m) from items where core)
            + (select sum(coalesce(pilot_2026_m, 0)) from arenas)
            + (select sum(tax_break_cumulative_2026_m) from arenas where tax_break_in_expanded_total = 'Y'))
  unit: pct
  digits: 0
  basis: share of 2026 dollars
  label: a
  sources: [ledger]

- key: after_opening_share
  title: Share of public money that came after the arenas opened, counting tax breaks
  sql: |
    select 100 - 100 * ((select sum(public_2026_m) from items where core and kind = 'construction')
                        + (select sum(coalesce(pilot_2026_m, 0)) from arenas))
         / ((select sum(public_2026_m) from items where core)
            + (select sum(coalesce(pilot_2026_m, 0)) from arenas)
            + (select sum(tax_break_cumulative_2026_m) from arenas where tax_break_in_expanded_total = 'Y'))
  unit: pct
  digits: 0
  basis: share of 2026 dollars
  label: a
  sources: [ledger]
  note: Renovations, purchases, yearly payments and property-tax exemptions, as a share of the expanded total.

