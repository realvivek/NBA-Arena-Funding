- key: value_top10_with_breaks
  title: Public money and tax breaks in the arenas of the 10 most valuable teams
  sql: |
    with r as (select team, row_number() over (order by forbes_2026_b desc, team) as k from team_values)
    select sum(coalesce((select sum(public_2026_m) from items i where i.team = a.team and i.core), 0)
               + coalesce(a.pilot_2026_m, 0)
               + case when a.tax_break_in_expanded_total = 'Y' then coalesce(a.tax_break_cumulative_2026_m, 0) else 0 end)
    from arenas a join r using (team) where r.k <= 10
  check: |
    select (select sum(coalesce((select sum(public_2026_m) from items i where i.team = a.team and i.core), 0)
                       + coalesce(a.pilot_2026_m, 0)
                       + case when a.tax_break_in_expanded_total = 'Y' then coalesce(a.tax_break_cumulative_2026_m, 0) else 0 end)
            from arenas a join (select team, row_number() over (order by forbes_2026_b desc, team) as k from team_values) r using (team)
            where r.k <= 10)
         < (select sum(i.public_2026_m) from items i
            join (select team, row_number() over (order by forbes_2026_b, team) as k from team_values) r using (team)
            where i.core and r.k <= 10)
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, team-ledger, fred-cpiaucns]
  note: Adds Barclays Center's PILOT bonds and the property-tax breaks for Madison Square Garden and the United Center. The check confirms the total is still below the public money in the arenas of the 10 least valuable teams.

- key: public_owned_n
  title: Arenas the public owns
  sql: select count(*) from arenas where owner_type like 'public%' and owner_type not like '%private operator%'
  check: select count(*) = 2 from arenas where owner_type like 'public title%'
  unit: count
  label: a
  sources: [ledger]
  note: Owned by a city, county, state or public authority. Two more, Barclays Center and Little Caesars Arena, have public title, held for their financing, and private operators; the Lakers' and Jazz's arenas stand on public land but are privately owned. The check confirms the two.

