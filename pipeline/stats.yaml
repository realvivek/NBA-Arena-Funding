- key: slc_sales_tax_rate
  title: Salt Lake City sales tax that pays for the Delta Center deal
  value: 0.5
  evidence: {file: data/ledger/ledger_items.csv, where: {item_id: UTA-renovation-3}, column: desc, contains: '0.5% city sales tax'}
  unit: pct
  digits: 1
  label: b
  sources_sql: select source_id from item_sources where item_id = 'UTA-renovation-3' and role = 'public' order by ord

- key: was_2024_deal
  title: DC money to buy and renovate Capital One Arena under the 2024 deal
  sql: select sum(public_nominal_m) from items where item_id in ('WAS-purchase', 'WAS-renovation-2')
  check: |
    select list_sort(list(team)) = ['IND', 'UTA', 'WAS']
    from (select team, sum(public_2026_m) v from items where core and kind in ('renovation', 'purchase') and year >= 2014
          group by team order by v desc limit 3)
  unit: usd_m
  basis: nominal, the amounts paid or committed
  label: b
  sources_sql: select source_id from item_sources where item_id in ('WAS-purchase', 'WAS-renovation-2') and role = 'public' order by item_id, ord
  note: $87.5 million purchase (2024) and $427.5 million renovation (face value). The check confirms that Indianapolis, Salt Lake City and Washington have put the most since 2014 into renovating or buying an existing arena.

- key: was_purchase
  title: What DC paid for Capital One Arena
  sql: select public_nominal_m from items where item_id = 'WAS-purchase'
  unit: usd_m
  digits: 1
