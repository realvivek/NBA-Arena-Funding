- key: fed_bond_cost
  title: Federal cost of tax-exempt arena bonds, estimated
  sql: select sum(fed_tax_expenditure_pv_2026_m) from arenas
  unit: usd_m
  basis: present value at issue, in 2026 dollars; an estimate
  label: a
  sources: [ledger, gayer-2016]
  check: |
    with b as (select team, cast(year as integer) as year, issuer_series, cast(par_dollars_year as integer) as py,
                      cast(fed_cost_par_m as double) as cp, try_cast(gdg_pv3_revenue_loss_m as double) as g
               from arena_bonds where coalesce(fed_cost_par_m, '') <> '')
    select abs(sum(coalesce(b.g, f.pv3_30yr_fed_loss_m) * b.cp / f.par_m * coalesce((select factor_2026 from cpi where cpi.year = b.py), 1))
               - (select sum(fed_tax_expenditure_pv_2026_m) from arenas)) < 0.5
    from fed_bond_cost f join b on b.team = f.team and b.year = f.year and b.issuer_series = f.issuer_series where f.tau = 0.28
  note: New money for the arena only. Refundings and taxable issues are left out, Salt Lake City's 2025 issue is counted at the arena's $525 million of $900 million, and Indianapolis's 2021 issue at its new money, about $254 million. The present value at issue of the federal income tax lost on the bonds' interest at a 28 percent marginal rate, converted to 2026 dollars from the year each issue's par is stated in (2014 for the issues from Gayer, Drukker and Gold's Table 3). For the seven issues in their data, their published values; for later issues, a level 30-year approximation that ran 13.8 percent above their values where both can be compared. Five counted issues' tax-exempt status is not confirmed or not stated in their documents (Atlanta 2017, Charlotte 2023, Detroit 2017, Indianapolis 2021 and Washington 2025). Paid by all U.S. taxpayers; not added to any total. The check confirms the issue-by-issue table adds up to the ledger's figure.

- key: fed_gdg_issues_n
  title: Counted bond issues valued with Gayer, Drukker and Gold's published figures
  sql: select count(*) from arena_bonds where coalesce(gdg_pv3_revenue_loss_m, '') <> '' and coalesce(fed_cost_par_m, '') <> ''
  unit: count
  label: a
  sources: [gayer-2016, ledger]

- key: fed_bond_cost_unconfirmed
  title: Part of the federal bond cost resting on issues whose tax-exempt status is not confirmed
  sql: |
    with b as (select team, cast(year as integer) as year, issuer_series, cast(par_dollars_year as integer) as py,
                      cast(fed_cost_par_m as double) as cp, try_cast(gdg_pv3_revenue_loss_m as double) as g, tax_status
               from arena_bonds where coalesce(fed_cost_par_m, '') <> '')
    select sum(coalesce(b.g, f.pv3_30yr_fed_loss_m) * b.cp / f.par_m * coalesce((select factor_2026 from cpi where cpi.year = b.py), 1))
    from fed_bond_cost f join b on b.team = f.team and b.year = f.year and b.issuer_series = f.issuer_series
    where f.tau = 0.28 and b.tax_status not like 'tax-exempt%'
  unit: usd_m
  basis: present value at issue, in 2026 dollars
  label: a
  sources: [ledger, gayer-2016]
  note: Atlanta 2017, Charlotte 2023, Detroit 2017, Indianapolis 2021 and Washington 2025.

- key: fed_tau
  title: Marginal tax rate used for the federal cost of tax-exempt bonds
  sql: select 100 * min(tau) from fed_bond_cost
  unit: pct
  digits: 0
  label: a
  sources: [gayer-2016]
  note: The lower of the two rates in the bond file; the 35 percent rate is shown there as a sensitivity.

- key: tax_breaks_n
  title: Tax breaks added to the expanded total
  sql: |
