# ------------------------------------------------------------------ every team, ranked
- key: arenas_public_n
  title: Arenas with public money or tax breaks
  sql: |
    select count(*) from arenas a
    where coalesce((select sum(public_2026_m) from items i where i.team = a.team and i.core), 0)
          + coalesce(a.pilot_2026_m, 0)
          + case when a.tax_break_in_expanded_total = 'Y' then coalesce(a.tax_break_cumulative_2026_m, 0) else 0 end > 0
  check: |
    select list(team order by v desc)[1:2] = ['BKN', 'NYK']
    from (select a.team, coalesce((select sum(public_2026_m) from items i where i.team = a.team and i.core), 0)
                 + coalesce(a.pilot_2026_m, 0)
                 + case when a.tax_break_in_expanded_total = 'Y' then coalesce(a.tax_break_cumulative_2026_m, 0) else 0 end as v
          from arenas a)
  unit: count
  label: a
  sources: [ledger]
  note: The check confirms that Brooklyn's and New York's arenas rank first and second when tax breaks are counted.

# The teams' values against the public money in their arenas (core, without tax breaks), by thirds of the league.
- key: value_group_n
  title: Teams in each third of the league by value
  sql: select count(*) / 3 from team_values
  check: select count(*) % 3 = 0 from team_values
  unit: count
  label: a
  sources: [team-ledger]

- key: value_bottom10_public
  title: Public money in the arenas of the 10 least valuable teams
  sql: |
    with r as (select team, row_number() over (order by forbes_2026_b, team) as k from team_values)
    select sum(i.public_2026_m) from items i join r using (team) where i.core and r.k <= 10
  check: |
    with r as (select team, forbes_2026_b as v, row_number() over (order by forbes_2026_b, team) as k from team_values)
    select (select v from r where k = 10) < (select v from r where k = 11)
       and (select v from r where k = 20) < (select v from r where k = 21)
  unit: usd_m
  basis: 2026 dollars
  label: a
  sources: [ledger, team-ledger, fred-cpiaucns]
  note: Values are Forbes's estimates of October 2026. Public money is the ledger's, without tax breaks. The check confirms that no two teams tie at the edges of the groups.

- key: value_public_rank_corr
  title: Rank correlation between a team's value and the public money in its arena
  sql: |
    with v as (select t.team, t.forbes_2026_b as x, coalesce(p.m, 0) as y
               from team_values t left join (select team, sum(public_2026_m) as m from items where core group by team) p using (team)),
         r as (select rank() over (order by x) + (count(*) over (partition by x) - 1) / 2.0 as rx,
                      rank() over (order by y) + (count(*) over (partition by y) - 1) / 2.0 as ry from v)
    select corr(rx, ry) from r
  check: |
    with v as (select t.team, t.forbes_2026_b as x, coalesce(p.m, 0) as y
               from team_values t left join (select team, sum(public_2026_m) as m from items where core group by team) p using (team)),
         r as (select rank() over (order by x) + (count(*) over (partition by x) - 1) / 2.0 as rx,
                      rank() over (order by y) + (count(*) over (partition by y) - 1) / 2.0 as ry from v)
    select corr(rx, ry) < -0.4 from r
  unit: number
  digits: 2
  basis: Spearman rank correlation, 30 teams
  label: a
  sources: [ledger, team-ledger]
  note: Spearman's rank correlation, with tied ranks averaged (six teams' arenas have no public money). The check confirms it is clearly negative.

- key: value_bottom10_share
  title: Share of all public money in the arenas of the 10 least valuable teams
  sql: |
    with r as (select team, row_number() over (order by forbes_2026_b, team) as k from team_values)
    select 100 * sum(i.public_2026_m) filter (where r.k <= 10) / sum(i.public_2026_m)
    from items i join r using (team) where i.core
  unit: pct
  basis: share of 2026 dollars
  label: a
  sources: [ledger, team-ledger]

