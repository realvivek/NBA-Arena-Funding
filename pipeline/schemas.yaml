# Constraints added to the inferred table schemas in data/datapackage.json (written by pipeline/datapackage.py).
# Field types for every CSV are inferred; the files the site reads get the rules below. Row rules that depend on
# other columns (for example, a source URL on every row that shows a figure) are checked by pipeline/build.py.

ledger/ledger_items.csv:
  primaryKey: [item_id]
  fields:
    team: {type: string, constraints: {required: true, pattern: '^[A-Z]{3}$'}}
    item_id: {type: string, constraints: {required: true, unique: true, pattern: '^[A-Z]{3}-[a-z]+(-[a-z0-9]+)*$'}}
    kind: {type: string, constraints: {required: true, enum: [construction, purchase, renovation, ongoing, project]}}
    year: {type: integer, constraints: {required: true, minimum: 1960, maximum: 2026}}
    status: {type: string, constraints: {required: true}}
    in_core: {type: string, constraints: {required: true, enum: ['Y', 'N']}}
    spending_nominal_m: {type: number, constraints: {required: true, minimum: 0}}
    public_nominal_m: {type: number, constraints: {required: true, minimum: 0}}
    cpi_factor: {type: number, constraints: {required: true, minimum: 1}}
    spending_2026_m: {type: number, constraints: {required: true, minimum: 0}}
    public_2026_m: {type: number, constraints: {required: true, minimum: 0}}
    public_label: {type: string, constraints: {required: true, pattern: '^[abc](/[abc])*( ; [abc](/[abc])*)*$'}}
    cost_label: {type: string, constraints: {pattern: '^[abc](/[abc])*( ; [abc](/[abc])*)*$'}}
    public_source: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}

ledger/ledger_buckets.csv:
  fields:
    item_id: {type: string, constraints: {required: true}}
    bucket: {type: string, constraints: {required: true, enum: [general, sales, tourist, meals, tif, leaserev, land, infra, sin, mixed]}}
    public_nominal_m: {type: number, constraints: {required: true, minimum: 0}}
    public_2026_m: {type: number, constraints: {required: true, minimum: 0}}

ledger/arena_ledger.csv:
  fields:
    row_type: {type: string, constraints: {required: true, pattern: '^(current_arena|project.*)$'}}
    team: {type: string, constraints: {required: true, pattern: '^[A-Z]{3}$'}}
    arena: {type: string, constraints: {required: true}}
    built_privately_majority: {type: string, constraints: {enum: ['Y', 'N', 'unresolved']}}
    construction_cost_label: {type: string, constraints: {pattern: '^[abc](/[abc])*$'}}
    PUBLIC_TOTAL_2026_m: {type: number, constraints: {minimum: 0}}
    public_share_pct: {type: number, constraints: {minimum: 0, maximum: 100}}

ledger/households.csv:
  fields:
    team: {type: string, constraints: {required: true, pattern: '^[A-Z]{3}$'}}
    geo_id: {type: string, constraints: {required: true, pattern: '^[0-9]{5}US[0-9]+$'}}
    households: {type: integer, constraints: {required: true, minimum: 1}}
    share: {type: number, constraints: {required: true, minimum: 0, maximum: 1}}
    per_household_2026: {type: number, constraints: {required: true, minimum: 0}}

threats/threat_ledger.csv:
  primaryKey: [id]
  fields:
    id: {type: string, constraints: {required: true, unique: true, pattern: '^E[0-9]{2}$'}}
    threat_class: {type: string, constraints: {required: true, enum: [explicit, implied, official_cited, lure_only, unclear, none]}}
    sources: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}
    label: {type: string, constraints: {required: true, pattern: '^[abcu].*'}}

threats/left_behind.csv:
  fields:
    city: {type: string, constraints: {required: true, unique: true}}
    sources: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}
    label: {type: string, constraints: {required: true, pattern: '^[abcu].*'}}

authorities/lease_clock.csv:
  primaryKey: [team]
  fields:
    team: {type: string, constraints: {required: true, unique: true, pattern: '^[A-Z]{3}$'}}
    term_end_year: {type: number, constraints: {minimum: 2026, maximum: 2100}}
    summary: {type: string, constraints: {required: true}}
    label: {type: string, constraints: {required: true, pattern: '^[abcu].*'}}

property_tax/united_center_formula_savings.csv:
  primaryKey: [tax_year]
  fields:
    tax_year: {type: integer, constraints: {required: true, minimum: 2002, maximum: 2016}}
    paid_with_floor: {type: integer, constraints: {required: true, minimum: 1000000}}
    rate_label: {type: string, constraints: {required: true, enum: [b, c]}}

property_tax/united_center_tax_bills_2017_2024.csv:
  primaryKey: [tax_year]
  fields:
    tax_year: {type: integer, constraints: {required: true, minimum: 2017, maximum: 2024}}
    bill: {type: integer, constraints: {required: true, minimum: 0}}
    label: {type: string, constraints: {required: true, enum: [b]}}

dedicated_taxes/slc_ccr_monthly.csv:
  fields:
    month: {type: string, constraints: {required: true, unique: true, pattern: '^20[0-9]{2}-[01][0-9]$'}}
    slc_ccr_final_distribution_usd: {type: number, constraints: {required: true, minimum: 0}}

tax_mechanisms/nba_arena_bond_federal_cost.csv:
  fields:
    tau: {type: number, constraints: {required: true, enum: [0.28, 0.35]}}
    pv3_30yr_fed_loss_m: {type: number, constraints: {required: true, minimum: 0}}

inputs/cpi/CPIAUCNS.csv:
  primaryKey: [observation_date]
  fields:
    observation_date: {type: date, constraints: {required: true, unique: true}}
    CPIAUCNS: {type: number}

inputs/arena_coordinates.csv:
  primaryKey: [team]
  fields:
    team: {type: string, constraints: {required: true, unique: true, pattern: '^[A-Z]{3}$'}}
    lat: {type: number, constraints: {required: true, minimum: 24, maximum: 50}}
    lon: {type: number, constraints: {required: true, minimum: -125, maximum: -66}}
    source: {type: string, constraints: {required: true, pattern: '^https://en[.]wikipedia[.]org/wiki/.+'}}

inputs/research_claims.csv:
  primaryKey: [key]
  fields:
    key: {type: string, constraints: {required: true, unique: true}}
    quote: {type: string, constraints: {required: true}}
    source: {type: string, constraints: {required: true, pattern: '^https?://.+'}}

teams/team_values.csv:
  primaryKey: [team]
  fields:
    team: {type: string, constraints: {required: true, unique: true, pattern: '^[A-Z]{3}$'}}
    owner: {type: string, constraints: {required: true}}
    owner_class: {type: string, constraints: {required: true, enum: [private_equity, other_finance, other]}}
    owner_source: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}
    control_year: {type: integer, constraints: {required: true, minimum: 1960, maximum: 2026}}
    price_year: {type: integer, constraints: {required: true, minimum: 1960, maximum: 2026}}
    price_m: {type: number, constraints: {minimum: 1}}
    price_scope: {type: string, constraints: {required: true, enum: [team, team_with_assets, valuation, not_comparable]}}
    price_label: {type: string, constraints: {required: true, enum: [b, c]}}
    price_source: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}
    seller_price_m: {type: number, constraints: {minimum: 1}}
    seller_year: {type: integer, constraints: {minimum: 1960, maximum: 2026}}
    forbes_2025_b: {type: number, constraints: {required: true, minimum: 1, maximum: 50}}
    forbes_2026_b: {type: number, constraints: {required: true, minimum: 1, maximum: 50}}
    sportico_2026_b: {type: number, constraints: {required: true, minimum: 1, maximum: 50}}
    value_label: {type: string, constraints: {required: true, enum: [c]}}
    value_source: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}
    deal_value_b: {type: number, constraints: {minimum: 0.1, maximum: 50}}
    deal_date: {type: string, constraints: {pattern: '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$'}}
    deal_label: {type: string, constraints: {enum: [b, c]}}
    deal_source: {type: string, constraints: {pattern: '.*https?://.*'}}

teams/value_history.csv:
  primaryKey: [year]
  fields:
    year: {type: integer, constraints: {required: true, unique: true, minimum: 1990, maximum: 2025}}
    reported: {type: date, constraints: {required: true}}
    forbes_avg_b: {type: number, constraints: {required: true, minimum: 0.05, maximum: 50}}
    label: {type: string, constraints: {required: true, enum: [c]}}
    source: {type: string, constraints: {required: true, pattern: '^https?://.+'}}

teams/public_return.csv:
  primaryKey: [team]
  fields:
    team: {type: string, constraints: {required: true, unique: true, pattern: '^[A-Z]{3}$'}}
    public_deal: {type: string, constraints: {required: true, enum: ['Y', 'N']}}
    sale_share: {type: string, constraints: {required: true, enum: ['no', none_found, unknown, private_arena]}}
    equity_stake: {type: string, constraints: {required: true, enum: ['Y', 'N']}}
    summary: {type: string, constraints: {required: true}}
    label: {type: string, constraints: {required: true, enum: [a, b, c, b/c, u]}}

teams/investors.csv:
  primaryKey: [fund, team]
  fields:
    fund: {type: string, constraints: {required: true}}
    team: {type: string, constraints: {required: true, pattern: '^[A-Z]{3}$'}}
    entered: {type: string, constraints: {pattern: '^20[0-9]{2}-[01][0-9](-[0-3][0-9])?$'}}
    entry_value_b: {type: number, constraints: {minimum: 0.1, maximum: 50}}
    status: {type: string, constraints: {required: true, enum: [current, exited, pending]}}
    label: {type: string, constraints: {required: true, enum: [b, c, b/c]}}
    source: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}

who_pays/itep_who_pays_7.csv:
  fields:
    state: {type: string, constraints: {required: true}}
    line: {type: string, constraints: {required: true, enum: [APP_A, SE_GST, SE_EXCISE, PROP_TOTAL]}}
    grp: {type: string, constraints: {required: true, enum: ['Lowest 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Next 15%', 'Next 4%', 'Top 1%']}}
    grp_order: {type: integer, constraints: {required: true, minimum: 1, maximum: 7}}
    share_of_income: {type: number, constraints: {required: true, minimum: 0, maximum: 0.5}}
    label: {type: string, constraints: {required: true, enum: [c]}}

who_pays/itep_tax_lines.csv:
  fields:
    team: {type: string, constraints: {required: true, pattern: '^[A-Z]{3}$'}}
    bucket: {type: string, constraints: {required: true, enum: [general, sales, tif, leaserev, sin]}}
    state: {type: string, constraints: {required: true}}
    line: {type: string, constraints: {required: true, enum: [APP_A, SE_GST, SE_EXCISE, PROP_TOTAL]}}
    note: {type: string, constraints: {required: true}}

who_pays/bexar_2025_prop_b_precincts.csv:
  primaryKey: [precinct]
  fields:
    precinct: {type: string, constraints: {required: true, unique: true, pattern: '^[0-9]{4}$'}}
    registered: {type: integer, constraints: {required: true, minimum: 0}}
    ballots: {type: integer, constraints: {required: true, minimum: 0}}
    yes_votes: {type: integer, constraints: {required: true, minimum: 0}}
    no_votes: {type: integer, constraints: {required: true, minimum: 0}}
    households_est: {type: integer, constraints: {required: true, minimum: 0}}
    median_income_est: {type: integer, constraints: {minimum: 1000}}
    lon: {type: number, constraints: {required: true, minimum: -99.2, maximum: -98.0}}
    lat: {type: number, constraints: {required: true, minimum: 29.0, maximum: 29.9}}
    label: {type: string, constraints: {required: true, enum: [b/a]}}

who_pays/bexar_arena_sites.csv:
  fields:
    site: {type: string, constraints: {required: true, unique: true}}
    lat: {type: number, constraints: {required: true, minimum: 29.0, maximum: 29.9}}
    lon: {type: number, constraints: {required: true, minimum: -99.2, maximum: -98.0}}
    source: {type: string, constraints: {required: true, pattern: '.*https?://.*'}}

who_pays/zip_jurisdictions.csv:
  fields:
    zip: {type: string, constraints: {required: true, pattern: '^[0-9]{5}$'}}
    geo_id: {type: string, constraints: {required: true, pattern: '^[0-9]{5}US[0-9]+$'}}
    land_share: {type: number, constraints: {required: true, minimum: 0.05, maximum: 1}}

who_pays/sources.csv:
  fields:
    claim: {type: string, constraints: {required: true}}
    label: {type: string, constraints: {required: true, pattern: '^[abcu](/[abc])*$'}}
    source: {type: string, constraints: {required: true, pattern: '^https?://.+'}}
