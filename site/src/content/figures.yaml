# Chart frames. Titles state the finding; numbers are tokens from pipeline/stats.yaml.
# Text fields are folded block scalars (>-) so colons and braces need no quoting.

bill:
  title: >-
    Of the public money in the arenas, {{after_opening_share}} came, or is committed, after they opened
  sub: >-
    Public money in the {{arenas_n}} arenas NBA teams play in, by kind, in 2026 dollars. Building the arenas is
    blue; everything else is orange, in alternating shades
  dataset: public-layers
  notes:
    - >-
      Building includes {{bkn_pilot}} of Barclays Center bonds repaid with the property tax the arena would
      otherwise owe. Tax breaks are property-tax breaks for Madison Square Garden and the United Center. The
      federal cost of tax-exempt arena bonds, an estimated {{fed_bond_cost}}, is not included, because a different
      public pays it. The number of bills for each
      kind is rounded to the nearest bill; the amounts beside them are not.

values:
  title: >-
    The median team is worth {{value_multiple_median}} times what its owners paid, after inflation
  sub: >-
    For each team, the price its controlling owners paid, in 2026 dollars; its value in October 2026, as estimated
    by Forbes; and the public money in its arena, including tax breaks
  dataset: team-values
  legend:
    - { label: Value in 2026, key: dot-orange }
    - { label: Price paid in 2026 dollars, key: ring }
    - { label: Public money in the arena, key: public }
    - { label: Tax breaks and taxes diverted to arena debt, key: public-soft }
  notes:
    - >-
      Prices are what the current controlling owners paid, or the valuation at which they bought control; some
      included an arena or other teams. Prices for the Heat, Knicks, Raptors and Wizards are not shown, because
      they were not disclosed or bought more or less than the team. Forbes counts a team and its arena operations,
      not the arena's real estate.

trend:
  title: >-
    The average NBA team was worth {{value_mean_2026}} in 2026, {{value_growth_2014}} times the 2014 average
  sub: >-
    Average team value on each year's Forbes list, in the dollars of the day
  dataset: value-history
  notes:
    - >-
      Forbes's published averages; the 2026 figure is the mean of its {{arenas_n}} team values of October 2026.
      Years with no list, or whose list could not be read, are left out.

owners:
  title: >-
    {{finance_teams_n:cap}} of the {{arenas_n}} teams have an owner from finance or an investment fund behind them
  sub: >-
    Each team, marked by where its controlling owners made their money, with the investment funds that hold a stake
    in the team or its parent company, as of October 2026
  dataset: ownership
  legend:
    - { label: Owners from private equity or hedge funds, key: orange }
    - { label: Owners from other finance, key: orange-soft }
    - { label: An investment fund holds a stake, key: aqua }
  notes:
    - >-
      Source of wealth from Forbes's profiles of the owners, or the release or report named in the data. The Bucks'
      controlling owners are Wes Edens, who co-founded the asset manager Fortress, and the Haslam family. Stakes seen
      only in search results, such as a reported Arctos stake in the Grizzlies, are left out. Josh Kushner's
      venture firm, Thrive, is part of the pending purchase of the Lakers.

rebuild:
  title: >-
    Since 2014, most public arena money has gone to existing arenas
  sub: >-
    Public money for new arenas and for renovating or buying existing ones, by the year the ledger counts it, one
    segment per arena, in 2026 dollars. Work under way and pending money stand at 2026, at face value
  dataset: rebuild-by-year
  legend:
    - { label: New arenas, key: public }
    - { label: Existing arenas, key: orange }
    - { label: Pending, key: pending-orange }
  notes:
    - >-
      Construction money is counted in the year an arena opened, renovations in the middle year of the work and
      purchases in the year of the sale. Money for work still under way, and pending money, is counted at face
      value in 2026.
    - >-
      Oklahoma City's arena under construction, {{okc_new_arena}}, is shown with the new arenas at face value
      in 2026, because it is binding. Not shown: Bexar County's {{sas_county}} for a new San Antonio arena,
      approved by voters but not yet binding; the city's {{sas_pending}}, pending, including up to {{sas_tirz}} of
      tax-increment debt the council approved on Sept. 10, 2026 to buy the site; and {{uta_district}} for the
      district around Salt Lake City's arena. Counting Bexar County's money with the new arenas, rebuilding has
      drawn {{rebuild_ratio_with_sas}} times as much as building.

arenas:
  title: >-
    The {{top_n}} arenas with the most public money hold {{top10_share}} of it
  sub: >-
    Public and private money spent on each of the {{arenas_n}} arenas in use, in 2026 dollars, with each arena's
    public share of the total
  dataset: arenas
  legend:
    - { label: Public money, key: public }
    - { label: Tax breaks and taxes diverted to arena debt, key: public-soft }
    - { label: Private money, key: private }
  notes:
    - >-
      Public money includes construction, purchases, completed or binding renovations and yearly payments.
      Shares count public money only; the tax breaks are shown but not included in the share. Private money is
      construction and renovation spending the public did not pay. Barclays Center's PILOT bonds paid for part
      of its construction, so they sit inside its bar and its private money is shown net of them.

valuegroups:
  title: >-
    The {{value_group_n}} least valuable teams play in arenas holding {{value_bottom10_share}} of the public money
  sub: >-
    Public money in each team's arena, in 2026 dollars, with the teams in thirds of the league by value, as Forbes
    estimated it in October 2026. Each segment is an arena
  dataset: team-values
  notes:
    - >-
      Tax breaks are not included. Counting Barclays Center's PILOT bonds and the property-tax breaks for Madison
      Square Garden and the United Center, the arenas of the {{value_group_n}} most valuable teams hold
      {{value_top10_with_breaks}}, still less than the {{value_bottom10_public}} in the arenas of the
      {{value_group_n}} least valuable. A team's value tracks the size of its market and the money its arena
      makes, so the chart shows where the public money went, not why.

map:
  title: >-
    The largest public shares are in the South and the middle of the country
  sub: >-
    Each arena's public money, in 2026 dollars, and the public share of everything spent on it
  dataset: arena-map
  notes:
    - >-
      Circles are sized by public money. Arenas with no public money found are shown as small rings.

takeovers:
  title: >-
    Built with private money, then bought or rebuilt with public money
  sub: >-
    The {{takeover_n}} arenas built mainly with private money that later got public money to buy or renovate
    them. Each row is an arena's life: what it cost to build, then public money as it came, in 2026 dollars
  dataset: takeovers
  legend:
    - { label: Public money, key: public }
    - { label: Private money, key: private }
    - { label: Pending, key: pending }
  notes:
    - >-
      Circles are sized by dollars on one scale. The first circle in each row is the arena's construction, with
      the public share as a wedge; later circles are public money to buy or renovate it, and deals close together
      in time are drawn as one circle, labeled with their years. Money for work still under way is counted at face
      value in 2026. Private money for later renovations is not shown.
    - >-
      Indianapolis is not shown, because its records conflict on who paid to build its arena.

whopays:
  title: >-
    Taxes residents mostly pay supplied {{residents_share}} of public arena capital, hotel and car-rental taxes
    {{visitors_share}}
  sub: >-
    Public money for construction, purchases and renovations, by funding stream, grouped by who mostly pays, in
    2026 dollars
  dataset: who-pays
  legend:
    - { label: Mostly visitors, key: orange }
    - { label: Visitors and residents, key: orange-soft }
    - { label: Mostly residents, key: public }
    - { label: 'Land, or not split by stream', key: other }
  notes:
    - >-
      Each dollar is assigned to one stream, as documented in the arena's records. Money that the records tie to
      several streams without splitting it is shown as not split. Meal and ticket taxes are shown apart from
      hotel and car-rental taxes because residents pay much of them; Indianapolis's and Milwaukee's pool them
      with hotel taxes, and the records do not split the pools. Counting them with visitor taxes gives
      {{visitors_shared_share}}. Yearly payments to teams and operators, {{ongoing_public}}, are not included.

payershift:
  title: >-
    Since 2014, taxes residents mostly pay have supplied {{residents_share_since_2014}} of public arena capital
  sub: >-
    Public money to build, renovate and buy the arenas, by who mostly pays the taxes behind it, before and since
    2014, in 2026 dollars
  dataset: payer-periods
  legend:
    - { label: Mostly visitors, key: orange }
    - { label: Visitors and residents, key: orange-soft }
    - { label: Mostly residents, key: public }
    - { label: 'Land, or not split by stream', key: other }
  notes:
    - >-
      Money is dated as the ledger dates it: construction in the year the arena opened, renovations in the middle
      year of the work, purchases in the year of the sale, and work still under way in 2026. Without Salt Lake
      City's and Washington's deals, taxes residents mostly pay supplied {{residents_share_since_2014_ex}} of the
      money since 2014. Yearly payments to teams and operators are not included.

households:
  title: >-
    In Salt Lake City, the arena deal comes to as much as {{hh_uta}} per household
  sub: >-
    Public money in the largest deals, per household where each arena is, adding the shares of every government
    that pays, in 2026 dollars
  dataset: households-local
  legend:
    - { label: City or county share, key: public }
    - { label: State share, key: public-soft }
  notes:
    - >-
      Households are from the Census Bureau's 2024 American Community Survey. Marks follow one rule: an upper
      bound where most of the money is a dedicated sales tax, which people who live elsewhere also pay; mostly
      visitor taxes where most of it is hotel and car-rental taxes; partly visitor taxes where most of it is meal
      and ticket taxes, alone or pooled with hotel taxes. Portland's row includes the {{por_pending}} pending for
      the Moda Center; pending money is left out of the other rows.

uc:
  title: >-
    A 1989 formula held the United Center's tax bill to {{uc_formula_bill_min}} to {{uc_formula_bill_max}} a year
    in 2002-2016
  sub: >-
    Property tax billed on the United Center, and the estimated bill without the stadium valuation formula,
    nominal dollars
  dataset: uc-bills
  legend:
    - { label: Bill paid, key: line-public }
    - { label: Estimated bill without the formula, key: line-other }
  notes:
    - >-
      The estimate applies each year's equalization factor and tax rate to the Assessor's first value after the
      formula ended. Bills for 2002 to 2005 are computed from the Board of Review value, the equalization factor
      and the tax rate; the statute's minimum tax applied from 2005 to 2008.

ongoing:
  title: >-
    Since 2015, Indianapolis has spent {{ind_yearly_min_2026}} to {{ind_yearly_max_2026}} a year under its Pacers agreements
  sub: >-
    Documented yearly public payments to teams or arena operators, and costs paid for them, in 2026 dollars
  dataset: ongoing
  notes:
    - >-
      Each column is one year's payments. Years with no bar have no record in the documents reached, which does
      not always mean nothing was paid. Indianapolis's figures are the Capital Improvement Board's spending on
      the Fieldhouse's operating costs, including costs it pays directly, and its forgiveness of team loans.

threats:
  title: >-
    {{threats_same_city:cap}} of {{threats_counted}} relocation threats were followed by public money in the same city
  sub: >-
    Months from a threat to the approval of public money, for the {{lag_n}} cases dated at both ends, and the
    public share of deals with and without a prior threat
  dataset: threats
  legend:
    - { label: Threat, key: orange }
    - { label: Public money approved, key: public }
  notes:
    - >-
      A threat is a statement, sale, sale term, talks with another city or lease clause by an owner or the
      league that tied a team's future in a city to public money, openly or by implication. Medians of public
      share are for deals with a known total cost. The gap between them cannot be told apart from chance (p =
      {{p_share}}, Mann-Whitney test, {{threat_share_n}} deals after a threat and {{nothreat_share_n}} without).

leases:
  title: >-
    {{leases_by_2036:cap}} NBA leases end by 2036
  sub: >-
    The year each current arena lease or use agreement ends, with public money pending
  dataset: leases
  legend:
    - { label: Ends by 2036, key: public }
    - { label: Ends later, key: other }
  notes:
    - >-
      Arenas their teams own, and arenas whose lease term is not public, are not shown.

slc:
  title: >-
    Salt Lake City's arena sales tax, month by month
  sub: >-
    Final monthly distributions of the city's arena and district sales tax, nominal dollars
  dataset: slc-monthly
  notes:
    - >-
      The series starts small: {{slc_first_two_months}} in January and February 2025 together. From March 2025 on,
      every month brought at least {{slc_monthly_min_later}}.

wcd:
  title: >-
    The Wisconsin Center District's taxes on hotel rooms, meals and car rentals
  sub: >-
    Taxes collected for the district that owns Fiserv Forum, by source, nominal dollars
  dataset: wcd-annual
  legend:
    - { label: Hotel rooms, key: public }
    - { label: Food and drink, key: orange }
    - { label: Car rentals, key: aqua }
  notes:
    - >-
      Hotel rooms combine the basic and additional room taxes. The 2026 column, marked with an asterisk and drawn
      lighter, covers January through September only, so it is not a full year.
