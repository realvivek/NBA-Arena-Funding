# The story on the home page, written the way a newspaper's data story reads: short paragraphs with the key numbers
# in bold, a chart after the sentence that introduces it. One entry per section, in order of n. Numbers are tokens
# ({{key}}) from pipeline/stats.yaml; every paragraph and step cites sources by id (pipeline/sources.yaml), listed
# at the end of its chapter and, paragraph by paragraph, on the fact-check page. Text fields are folded block
# scalars (>-) so colons and quotes need no escaping. The copy check in src/lib/copy.ts runs on every block.

bill:
  n: 1
  blocks:
    - scrolly: bill
      steps:
        - step: built
          p: >-
            Governments paid **{{building_public}}**, in today's dollars, to build the {{arenas_n}} arenas NBA
            teams play in now, counting {{bkn_pilot}} of Barclays Center bonds repaid with the arena's property
            taxes. That is {{construction_share}} of what the public has put into them.
          sources: [ledger]
        - step: renovated
          p: >-
            Renovations took or will take **{{renovation_public}}** more, {{underway_public}} of it for work still
            under way or money still to be paid. Since 2014, fixing up or buying existing arenas has
            drawn {{rebuild_ratio}} times as much public money as building new ones, counting Oklahoma City's arena
            under construction.
          sources: [ledger]
        - step: bought
          p: >-
            Minneapolis, Portland and Washington paid the equivalent of **{{purchase_public}}** to buy arenas from
            their owners.
            Yearly payments to teams and arena operators, and costs the public pays for them, most of them in Miami and
            Indianapolis, add **{{ongoing_public}}**.
          sources: [ledger]
        - step: breaks
          p: >-
            Property-tax breaks add **{{exemptions_added}}**: taxes not collected on Madison Square Garden from
            fiscal 1984 to 2026, under an exemption that dates to 1982, and on the United Center under a 1989
            formula.
          sources: [ledger, ibo-2023-march-description-of-public-subsidies-for-m, nyc-dof-tax-expenditures-fy2026]
        - step: total
          p: >-
            That is **{{expanded_public}}** in all, and {{after_opening_share}} of it came, or is committed, after
            the arenas opened.
            Federal taxpayers carry an estimated {{fed_bond_cost}} more: the income tax forgone on the tax-exempt
            bonds sold for these arenas.
          sources: [ledger, gayer-2016]

teams:
  n: 2
  title: Every team, ranked
  blocks:
    - p: >-
        Counting tax breaks, at least {{arenas_public_n}} of the {{arenas_n}} arenas have taken public money.
        Brooklyn leads because of the bonds its arena's property taxes repay, and New York because of its
        property-tax exemption. Counting only direct public money, Indianapolis's Gainbridge Fieldhouse has taken
        the most: **{{ind_public}}**, {{ind_share}} of everything spent on it, from construction to renovations and
        yearly payments.
      sources: [ledger, ibo-2023-march-description-of-public-subsidies-for-m]
    - p: >-
        The less a team is worth, the more public money its arena has tended to take. The {{value_group_n}} teams
        worth the least, in Forbes's estimates, play in arenas holding **{{value_bottom10_public}}**,
        {{value_bottom10_share}} of all the public money; the {{value_group_n}} worth the most, {{value_top10_public}}.
      sources: [ledger, team-ledger]
    - fig: valuegroups
    - teams: all
      title: All the teams
      intro: >-
        Open a team for its record: the public money and the taxes behind it, the lease, what the owners paid and
        the team's value now. Public money is in 2026 dollars; values are Forbes's estimates of October 2026.
      sources: [ledger, team-ledger]
  more:
    - { page: arenas, text: 'Every arena, item by item' }

rebuild:
  n: 3
  title: The bill keeps coming after opening night
  blocks:
    - p: >-
        The spending does not stop when an arena opens. Since 2014, governments have put or committed
        **{{rebuild_since_2014}}** to renovating or buying arenas that already stand, {{rebuild_ratio}} times the
        {{build_since_2014}} for new ones: {{build_opened_since_2014}} for the arenas that opened in those years and
        {{okc_new_arena}} for Oklahoma City's, now under construction. Over those years, Indianapolis, Salt Lake City
        and Washington have each put or committed at least {{rebuild_top3_min}} to an arena that already stands.
      sources: [ledger]
    - fig: rebuild
    - p: >-
        The renovations now rival the buildings. Since 2014, {{renovations_over_cost_n}} renovations with public
        money have cost more than their arenas did to build, in 2026 dollars: in Indianapolis, Phoenix, Salt Lake
        City and Washington. Salt Lake City's public money alone is {{uta_renovation_multiple}} times what the Delta
        Center cost to build in 1991. Part of the shift is age: {{arenas_opened_1990_2005}} of the {{arenas_n}}
        arenas opened between 1990 and 2005, so most of them came due for major work in the same years.
      sources: [ledger]
    - p: >-
        {{takeover_n:cap}} arenas built mainly with private money, in Atlanta, Minneapolis, Phoenix, Portland, Salt
        Lake City and Washington, were later bought or rebuilt with public money: **{{takeover_public}}**, of which
        {{takeover_pending}} is pending, against {{takeover_construction_public}} when they were built.
      sources: [ledger]
  more:
    - { page: arenas, text: 'The record for each arena' }

pays:
  n: 4
  title: The bill has shifted from visitors to residents
  blocks:
    - p: >-
        Taxes on hotel rooms and car rentals, which fall mostly on visitors, supplied {{visitors_share}} of the
        public money to build, renovate and buy the arenas. Taxes on restaurant meals and tickets, which visitors
        and residents share, supplied {{shared_share}}, and taxes that residents mostly pay, {{residents_share}}.
      sources: [ledger]
    - p: >-
        The mix has changed. Before 2014, hotel and car-rental taxes supplied **{{visitors_share_before_2014}}** of
        the money and residents' taxes {{residents_share_before_2014}}. Since then, taxes residents mostly pay have supplied
        **{{residents_share_since_2014}}**, led by Salt Lake City's arena sales tax and Washington's general fund.
        Visitor taxes are still public money: a hotel tax spent on an arena is not spent on anything else.
      sources: [ledger]
    - fig: payershift
    - p: >-
        Which tax pays decides who carries the bill. A sales tax takes a far larger share of income from poor
        households than from rich ones: Utah's take about **{{itep_ut_sales_ratio}} times** as large a share from
        the poorest fifth of households as from the richest one percent, by the Institute on Taxation and Economic
        Policy's estimates, and Oklahoma's about {{itep_okc_sales_ratio}} times. Salt Lake City paid for its arena
        with a sales tax, as Oklahoma City did and is doing again. Washington paid from a general fund drawn from
        taxes that take {{itep_was_poorest}} of income from its poorest fifth of households and {{itep_was_top1}}
        from its richest one percent.
      sources: [itep-who-pays-7, ledger]
    - fig: incidence
    - p: >-
        The decisions rarely went to voters. Of the {{capital_since_2014}} put or committed since 2014,
        {{unvoted_since_2014_share}} was approved by councils, legislatures and appointed boards with no public vote.
        The rest came from taxes voters had approved: Oklahoma City's MAPS 4 sales tax in 2019 and Bexar County's
        venue tax, extended in 2008.
      sources: [ledger, threat-ledger, okc-maps-history, bexar-elections-2008-05-10-results, bondbuyer-san-antonio-shopping-list]
    - p: >-
        Bexar County's November 2025 vote on a new Spurs arena turned on its richest precincts. Proposition B, which
        put the county's visitor taxes toward the arena, passed with {{propb_yes_share}}. The fifth of precincts with
        the highest incomes voted **{{propb_top_yes}} yes** and cast {{propb_top_votes_share}} of the votes; in the
        rest of the county the measure drew {{propb_rest_yes}}.
      sources: [bexar-elections-2025-11-04-precinct, census-acs2024-5yr-bg-bexar]
    - fig: propb
    - lookup: zip
      title: What is your household's share?
      intro: >-
        Enter a ZIP code to see the public money committed to NBA arenas by the city, county and state that tax it,
        per household. The most is in Salt Lake City, at **{{hh_uta}}** a household.
      sources: [ledger, census-b11001-2024, census-zcta-county-2020, census-zcta-place-2020]
  more:
    - { page: taxes, text: 'Every funding stream' }
    - { page: households, text: 'Every deal, per household' }

gains:
  n: 5
  title: Team values soared. The public's share did not.
  blocks:
    - reveal: >-
        In 2025, Mark Walter bought control of the Los Angeles Lakers at a {{lal_price_2025}} valuation. In August
        2026 he agreed to sell his majority stake, pending a league vote, at a valuation of
      value: '{{lal_deal_2026}}.'
      sources: [team-ledger]
    - p: >-
        Forbes puts the average team at **{{value_mean_2026}}**, {{value_growth_2014}} times the average on its 2014
        list, before inflation. The rise came as the league's national media money grew: the TV deals signed in
        2014 were reported at {{nba_media_2014_annual}} a year, and the deals that began in the 2025-26 season are
        worth about {{nba_media_total}} over {{nba_media_years}} years.
      sources: [team-ledger, espn-nba-extends-television-deals-2014, ibj-nba-new-11-year-media-rights-deal-with-disney-nb]
    - fig: trend
    - p: >-
        Owners who sold recently left with many times what they paid. Paul Allen bought the Trail Blazers for
        {{por_seller_price}} in 1988; his estate sold control at a {{por_price_2026}} valuation in 2026.
      sources: [team-ledger]
    - fig: values
    - h3: What the public gets back
    - p: >-
        Rent and fees that do not grow with a team's value. Oklahoma City charges the Thunder **{{okc_game_fee}} a
        game**, capped at {{okc_fee_cap}} a year, for an arena the city is putting {{okc_new_arena}} into.
        Washington collects {{was_rent_min}} to {{was_rent_max}} a year after committing {{was_2024_deal}} to buy
        and renovate its arena.
      sources: [okc-pbcarena-use-license-agreementfinal-6-12-25-1, cfo-tafa-capital-one-arena-112624]
    - quote: >-
        The renovation is "likely increasing revenue and long-term value for Monumental."
      by: >-
        DC's chief financial officer, Nov. 26, 2024, on the public renovation of Capital One Arena. Monumental Sports
        owns the Wizards and the Capitals.
      sources: [cfo-tafa-capital-one-arena-112624]
    - p: >-
        None of the **{{public_deals_read}}** public arena deals whose terms could be read gives the public a share
        when the team is sold. It can be done: Minnesota's law for the Vikings gives the state and Minneapolis up to
        {{vikings_public_share}} of the gain, and the Denver Broncos' stadium lease paid {{broncos_sale_share}},
        {{broncos_sale_pct}} of the sale's net profit, to the stadium district for youth programs when the team was
        sold in 2022. The buyers took over the lease without that clause.
      sources: [team-ledger, revisor-473j-15, cbsnews-broncos-sale-help-youth-programs-denver-metro-ar]

behind:
  n: 6
  title: Who is behind the teams
  blocks:
    - p: >-
        More and more of the owners come from finance: {{control_sales_2015_finance_n}} of the
        {{control_sales_2015_n}} sales of control since 2015 went to buyers who made their money there, against
        {{control_sales_pre2015_finance_n}} of the {{control_sales_pre2015_n}} earlier sales to today's owners. Of the
        {{arenas_n}} controlling owners, **{{owners_finance_n}}** made their fortunes mainly in finance,
        {{owners_pe_n}} of them in private equity or hedge funds.
      sources: [team-ledger]
    - p: >-
        Since 2021 the league has also let investment funds buy into teams. {{funds_n:cap}} funds now hold stakes in
        **{{fund_teams_n}}** teams or their parent companies.
      sources: [team-ledger]
    - fig: owners
    - p: >-
        The league shares in one of the funds: Blue Owl's annual report says the NBA "receives a share of management
        fees and incentive allocations" from it.
      sources: [sec-owl-20251231]
    - p: >-
        People with money at stake help make the deals. In the 2026 session that produced up to {{por_state}} of
        state bonds for Portland's arena, the Trail Blazers' arena company reported **{{por_lobbying}}** of
        lobbying. San Antonio's study of its new arena district came from CSL International, a subsidiary of
        Legends, whose majority owner, Sixth Street, is an investor in the Spurs.
      sources: [olis-enrolled, opb-trail-blazers-moda-center-portland-basketball-sp, sacurrent-csl-legends-2025]
  more:
    - { page: who-is-behind, text: 'The investigation: funds, deal makers and federal tax breaks' }

next:
  n: 7
  title: The next round is already on the calendar
  blocks:
    - p: >-
        Leases are where new deals start. Of the current leases, **{{leases_by_2036}}** end by 2036,
        {{leases_by_2031}} of them by 2031. Since 1994, owners or the league threatened, openly or by implication, to
        move a team at least {{threats_counted}} times in the episodes documented here, and public money followed in
        the same city {{threats_same_city}} times, {{lag_within_24}} of them within {{lag_window}} months. Deals
        without a threat were no smaller and no less one-sided: the median public share was
        {{threat_median_share}} after a threat and {{nothreat_median_share}} without one, in small samples. In
        Portland, where the team was sold in 2026 to a buyer from Dallas, the state's money is approved but still
        pending; on Oct. 21, 2026, the city said it and the team had not yet agreed on the essential terms of a lease.
      sources: [threat-ledger, ledger, portland-ordinance-192244]
    - fig: leases
    - p: >-
        The asking has already begun. Memphis is holding **{{mem_pending}}** for a FedExForum renovation until the
        Grizzlies sign a new lease. Portland has **{{por_pending}}** pending for the Moda Center, including up to
        {{por_state}} of state bonds. San Antonio's own share of a new Spurs arena, up to {{sas_pending}}, is
        pending, on top of up to {{sas_county}} from Bexar County. In Houston, the state is expected to put about
        {{hou_pending}} into a renovation of the Toyota Center; no agreement has been found.
      sources: [tri-statedefender-p-349496, olis-enrolled, ksat-results-props-a-and-b-for-coliseum-complex-downt, click2houston-harris-county-approves-180m-toyota-center]
    - p: >-
        Oklahoma City is already building. Its new arena, with **{{okc_new_arena}}** of public money counting a
        garage and team offices, is due to open in 2028, and the Thunder's lease runs through at least 2053, with penalties of up to {{okc_exit_penalty}}
        for leaving early.
      sources: [okc-oklahoma-city-and-thunder-break-ground-on-contin, okc-okc-and-thunder-approve-agreements-to-keep-the-thu]
    - p: >-
        Expansion would bring more deals. In March 2026 the league's owners voted to explore adding teams in Las
        Vegas and Seattle. The labor contract keeps any expansion fees out of the revenue the league shares with
        players, and owners expect {{expansion_fee_min}} to {{expansion_fee_max}} each, ESPN reported in October 2026,
        money that teams have planned to spend on rosters, arena upgrades or debt. Seattle already shares arena-related tax revenue with the company that leases its arena:
        **{{sea_arena_payments_2024}}** in 2024. Nevada exempts games played by its own professional teams from its
        {{nv_live_ent_tax}} tax on live entertainment, and it has put public money into stadiums before: up to
        {{nv_nfl_bonds}} of county bonds for an NFL stadium in 2016 and up to {{nv_mlb_cap}} for a baseball stadium
        in 2023.
      sources: [nba-pr-expansion-las-vegas-seattle-2026, nba-cba-2023, espn-nba-intel-seattle-expansion-2026-10-16, seattle-2026-adopted-budget-finance-general, seattle-2025-26-proposed-budget-finance-general, nv-nrs-368a-live-entertainment-tax, nv-sb1-2016-stadium-bonds, nv-sb1-2023-mlb-stadium]
  more:
    - { page: leases, text: 'Every lease and its exit terms' }
    - { page: threats, text: 'All the threat episodes' }

claims:
  n: 8
  title: The arguments for the deals, checked against the record
  blocks:
    - p: >-
        Arena deals come with familiar arguments. Here is how they hold up against the records gathered for this
        story.
    - cards:
        - title: '"The team will leave without it"'
          value: Teams seldom leave
          text: >-
            Owners or the league threatened to move a team at least {{threats_counted}} times since 1994. Teams left
            {{threats_team_left}} times, and each time another city had public money waiting: Memphis, New Orleans,
            Oklahoma City and Brooklyn.
          sources: [threat-ledger]
        - title: '"The public chose this"'
          value: Rarely by vote
          text: >-
            Councils, legislatures and appointed boards approved {{unvoted_since_2014_share}} of the public capital
            put or committed since 2014, with no public vote. Petition drives for a vote in Sacramento and Cleveland
            ended without one.
          sources: [ledger, threat-ledger, okc-maps-history, bexar-elections-2008-05-10-results, foxnews-sacramento-approves-477-million-arena-caps-off-s, news5cleveland-cavaliers-withdraw-from-140-million-quicken-l]
        - title: '"Visitors pay for it"'
          value: Less and less
          text: >-
            Visitor taxes supplied {{visitors_share_before_2014}} of the public capital before 2014 and
            {{visitors_share_since_2014}} since. They are still public money: a hotel tax spent on an arena is not
            spent on anything else.
          sources: [ledger]
        - title: '"It was built with private money"'
          value: Not for long
          text: >-
            {{takeover_n:cap}} arenas built mainly with private money were later bought or rebuilt with public money.
            Miami's counts as privately built, but the county and the state have paid its operator {{mia_ongoing}}
            since 1998, {{mia_ongoing_multiple}} times the public money that went into building it.
          sources: [ledger]
        - title: '"The public owns the arena"'
          value: And pays for its upkeep
          text: >-
            The public owns {{public_owned_n}} of the {{arenas_n}} arenas, and with them the bills for repairs and
            renovations. None of the {{public_deals_read}} public deals whose terms could be read gives the public a
            share when the team is sold.
          sources: [ledger, team-ledger]
        - title: '"It pays for itself"'
          value: Not by the evidence
          text: >-
            Economists who reviewed more than {{research_studies}} studies over {{research_years}} years found "very
            limited economic impacts of professional sports teams and stadiums." A 2026 study of Detroit found that
            sports events at its new arena were not associated with a significant rise in demand for hotel rooms or
            short-term rentals.
          sources: [bradbury-2023, jakar-2026-detroit-sport-tourism]
    - h3: What the deals promised
    - p: >-
        Where the records allow a check, housing and development promises fell short, revenue promises went both
        ways, and hiring goals were met in some cities and missed in others.
    - cards:
        - title: Sacramento
          value: Revenue
          text: >-
            The city told bond investors in 2015 that parking revenue would cover its arena payments, with "no net
            effect on the General Fund." By 2023 the general fund had paid more than {{sac_gf_backfill}} over
            {{sac_gf_backfill_years}} years.
          sources: [cityofsacramento-2015-lease-revenue-bonds-series-2015-g1c, fieldofschemes-why-the-kings-arena-parking-revenue-fiasco-is-bad]
        - title: Detroit
          value: Hiring
          text: >-
            The 2013 agreement required Detroit residents to fill at least {{det_hire_target}} of the construction
            jobs. They worked {{det_hire_actual}} of the hours, and contractors paid {{det_hire_fines}} in fines.
          sources: [michigan-snyder-detroit-arena-4380-jobs-2013, constructiondive-detroit-arena-local-hire-fines-2018]
        - title: Brooklyn
          value: Housing
          text: >-
            The development around Barclays Center promised {{bkn_affordable_promised}} affordable apartments. By
            the 2025 deadline {{bkn_affordable_built}} were built, and the state accepted a {{bkn_affordable_penalty}}
            penalty for the rest.
          sources: [ibo-atlantic-yards-2005, citylimits-atlantic-yards-reboot-2026]
        - title: Miami
          value: Profit share
          text: >-
            The county was promised {{mia_profit_share}} of the arena's net cash flow above {{mia_profit_threshold}}
            a year. The formula paid once, {{mia_profit_paid}} in 2013, and the clause was dropped in 2014.
          sources: [miamidadeig-ig11-34finalbasketball, miamidade-2014-06-03-bcc]
    - p: >-
        Some promises held. Sacramento's arena exceeded its local-hiring goals, the city auditor found, and Salt Lake
        City's arena sales tax, projected to raise about {{slc_tax_projection}} over {{slc_tax_projection_years}}
        years, brought in {{slc_tax_fy2026}} in its first full fiscal year.
      sources: [sacramento-auditor-golden1-hiring-2017, slc-council-sec-district-2024, utah-tax-distributions]

method:
  n: 9
  title: How this was made
  blocks:
    - p: >-
        Every figure comes from ledgers built from {{sources_n}} documents: {{sources_government}} from governments,
        {{sources_court}} from a court, {{sources_team}} from teams, the league or their filings, and
        {{sources_independent}} from news organizations, researchers and reference works. Each is labeled as computed, taken from a primary document,
        or taken from the press or another secondary source.
      sources: [ledger, team-ledger]
    - p: >-
        The totals line up with the most complete academic count, J.C. Bradbury's 2026 database of venue costs, which
        builds on Judith Grant Long's: it puts public money for building today's {{arenas_n}} arenas at
        {{bradbury_public_2026}} in 2026 dollars, against {{construction_public}} here before Barclays Center's PILOT
        bonds. Arena by arena they often differ, at {{bradbury_gap_n}} of the {{bradbury_compared_n}} arenas with public
        money in either count by more than a tenth, mostly over land, site work, purchases and bonds repaid by a team
        or by property taxes. Like most published estimates, it counts only construction; renovations, purchases and
        yearly payments add {{non_construction_public}} here.
      sources: [bradbury-2026-venue-database, ledger]
    - p: >-
        Dollars are in 2026 terms, converted with the Consumer Price Index for All Urban Consumers, not seasonally
        adjusted, on the January-August 2026 average ({{cpi_base}}). Pending deals are reported but not counted.
        Team values are Forbes's estimates of October 2026. The totals are probably low: some records could not be
        reached, among them municipal bond disclosures on EMMA. The [fact-check page](/fact-check/) lists every
        number with its sources and the corrections made during the work.
      sources: [fred-cpiaucns, ledger, team-ledger]
  more:
    - { page: fact-check, text: 'Every number and its sources' }
    - { page: sources, text: 'The documents' }
