# The story on the home page. One entry per section, in order of n. Numbers are tokens ({{key}}) from
# pipeline/stats.yaml; paragraphs, steps, key figures and cards cite sources by id (pipeline/sources.yaml). Text
# fields are folded block scalars (>-) so colons and quotes need no escaping. The copy check in src/lib/copy.ts
# runs on every block. Keep it short: a chapter is a sentence or two, its key figures and its chart.

bill:
  n: 1
  blocks:
    - scrolly: bill
      steps:
        - step: built
          p: >-
            Governments paid **{{construction_public}}**, in today's dollars, to build the {{arenas_n}} arenas NBA
            teams play in now. That is only {{construction_share}} of what the public has put into them.
          sources: [ledger]
        - step: renovated
          p: >-
            Renovations took **{{renovation_public}}** more. Since 2014, fixing up or buying existing arenas has
            drawn {{rebuild_ratio}} times as much public money as building new ones.
          sources: [ledger]
        - step: bought
          p: >-
            Minneapolis, Portland and Washington paid **{{purchase_public}}** to buy arenas from their owners.
            Yearly payments to teams and arena operators, most of them in Miami and Indianapolis, add
            **{{ongoing_public}}**.
          sources: [ledger]
        - step: breaks
          p: >-
            Tax breaks add **{{tax_breaks_added}}**: property taxes never collected, like Madison Square Garden's
            exemption since 1982, and taxes redirected to arena debt, like Barclays Center's.
          sources: [ledger, ibo-2023-march-description-of-public-subsidies-for-m]
        - step: total
          p: >-
            **{{expanded_public}}** in all. Federal taxpayers carry another {{fed_bond_cost}}: the income tax
            forgone on the tax-exempt bonds sold for these arenas.
          sources: [ledger, gayer-2016]

teams:
  n: 2
  title: Every team, ranked
  nav: Every team
  blocks:
    - p: >-
        Counting tax breaks, {{arenas_public_n}} of the {{arenas_n}} arenas have taken public money. In cash,
        Orlando's Kia Center has taken the most: {{orl_public}}, {{orl_share}} of everything spent on it.
      sources: [ledger]
    - teams: all
      title: All the teams
      intro: >-
        Open a team for its record: public money and the taxes behind it, the lease, what the owners paid and the
        team's value now. Public money is in 2026 dollars; values are Forbes's estimates of October 2026.
      sources: [ledger, team-ledger]
  more:
    - { page: arenas, text: 'Every arena, item by item' }

rebuild:
  n: 3
  title: The bill keeps coming after opening night
  nav: After opening night
  blocks:
    - p: >-
        Since 2014, most public money for arena buildings has gone to arenas that already stand.
      sources: [ledger]
    - stats:
        - value: '{{rebuild_since_2014:short}}'
          label: to renovate or buy existing arenas since 2014
        - value: '{{rebuild_ratio}}×'
          label: the {{build_since_2014}} for the arenas that opened in those years
        - value: '{{takeover_public:short}}'
          label: >-
            to buy or rebuild {{takeover_n}} arenas first built mainly with private money, {{takeover_pending}} of
            it still pending
      sources: [ledger]
    - fig: rebuild
  more:
    - { page: arenas, text: 'The record for each arena' }

pays:
  n: 4
  title: Visitors pay a large share
  nav: Who pays
  blocks:
    - p: >-
        Taxes on hotel rooms, car rentals, restaurant meals and tickets, which fall mostly on visitors, supplied
        {{visitors_share}} of the public money to build, renovate and buy the arenas. Taxes residents mostly pay
        supplied {{residents_share}}.
      sources: [ledger]
    - fig: whopays
    - h3: The largest commitments per household
    - stats:
        - value: '{{hh_uta:short}}'
          label: >-
            per Salt Lake City household for the Delta Center deal, an upper bound: people who live elsewhere pay
            part of the tax
        - value: '{{hh_okc:short}}'
          label: per Oklahoma City household, for its current and new arenas
        - value: '{{hh_was:short}}'
          label: per Washington household, for Capital One Arena since 1997
      sources: [ledger, census-b11001-2024]
  more:
    - { page: taxes, text: 'Every funding stream' }
    - { page: households, text: 'Every deal, per household' }

gains:
  n: 5
  title: Team values soared. The public's share did not.
  nav: Team values
  blocks:
    - stats:
        - value: '{{lal_deal_2026:short}}'
          label: the Lakers' value in the August 2026 deal to sell control, pending a league vote
        - value: '{{value_mean_2026:short}}'
          label: the average team's value, {{value_growth_2014}} times the 2014 average before inflation
        - value: '{{value_multiple_median}}×'
          label: the median team's value against the price its owners paid, after inflation
      sources: [team-ledger]
    - fig: trend
    - p: >-
        Owners who sold recently left with many times what they paid. Paul Allen bought the Trail Blazers for
        {{por_seller_price}} in 1988; his estate sold them at {{por_price_2026}} in 2026.
      sources: [team-ledger]
    - fig: values
    - h3: What the public gets back
    - cards:
        - title: Oklahoma City
          value: '{{okc_game_fee}} a game'
          text: >-
            The Thunder's license fee under the 2025 agreement, capped at {{okc_fee_cap}} a year, for an arena the
            city is putting {{okc_new_arena}} into.
          sources: [okc-pbcarena-use-license-agreementfinal-6-12-25-1]
        - title: Washington
          value: '{{was_rent_min:short}} to {{was_rent_max:short}}'
          text: >-
            Yearly rent from the teams, after the District committed {{was_2024_deal}} to buy and renovate
            Capital One Arena.
          sources: [cfo-tafa-capital-one-arena-112624]
        - title: Every sale
          value: '{{sale_share_found:short}} of {{public_deals_reviewed}}'
          text: >-
            Public arena deals reviewed that give the public a share when the team is sold. Minnesota's law for the
            Vikings gives the state and Minneapolis up to {{vikings_public_share}} of the gain.
          sources: [team-ledger, revisor-473j-15]
    - quote: >-
        The renovation is "likely increasing revenue and long-term value for Monumental."
      by: >-
        DC's chief financial officer, Nov. 26, 2024, on the public renovation of Capital One Arena. Monumental Sports
        owns the Wizards and the Capitals.
      sources: [cfo-tafa-capital-one-arena-112624]

behind:
  n: 6
  title: Who is behind the teams
  nav: Who is behind
  blocks:
    - stats:
        - value: '{{funds_n:short}}'
          label: investment funds hold stakes in {{fund_teams_n}} teams or their parent companies
        - value: '{{owners_finance_n}}'
          label: of the {{arenas_n}} controlling owners made their money mainly in finance
        - value: '{{finance_teams_public:short}}'
          label: >-
            in public money, with tax breaks, for the arenas of the {{finance_teams_n}} teams with an owner from
            finance or a fund stake
      sources: [team-ledger, ledger]
    - fig: owners
    - cards:
        - title: The league shares in a fund
          text: >-
            Blue Owl's annual report says the NBA "receives a share of management fees and incentive allocations"
            from the fund that holds stakes in {{homecourt_teams_n}} teams.
          sources: [sec-owl-20251231]
        - title: Lobbying in Portland
          value: '{{por_lobbying}}'
          text: >-
            Reported by the Trail Blazers' arena company in the 2026 session that produced up to {{por_state}} of
            state bonds for its arena.
          sources: [olis-enrolled]
        - title: A study in San Antonio
          text: >-
            The city's study of the arena district came from CSL International, a subsidiary of Legends, whose
            majority owner, Sixth Street, is an investor in the Spurs.
          sources: [sacurrent-csl-legends-2025]
  more:
    - { page: who-is-behind, text: 'The investigation: funds, deal makers and federal tax breaks' }

next:
  n: 7
  title: The next round is already on the calendar
  nav: What's next
  blocks:
    - stats:
        - value: '{{leases_by_2036}}'
          label: arena leases end by 2036, {{leases_by_2031}} of them by 2031
        - value: '{{threats_same_city}} of {{threats_counted}}'
          label: >-
            relocation threats since 1994 were followed by public money in the same city, a median
            {{lag_median}} months later
        - value: '{{pending_existing:short}}'
          label: of public money pending for existing arenas in Memphis and Portland
      sources: [threat-ledger, ledger]
    - fig: leases
    - cards:
        - title: Memphis
          value: '{{mem_pending:short}}'
          text: Held for a FedExForum renovation until the Grizzlies sign a new lease.
          sources: [tri-statedefender-p-349496]
        - title: Portland
          value: '{{por_pending:short}}'
          text: >-
            Pending for the Moda Center, including up to {{por_state}} of state bonds repaid with an amount equal to
            income taxes on work at the arena.
          sources: [olis-enrolled]
        - title: San Antonio
          value: '{{sas_pending:short}}'
          text: >-
            The most the city would put into a new Spurs arena, pending, on top of up to {{sas_county}} from Bexar
            County.
          sources: [ksat-results-props-a-and-b-for-coliseum-complex-downt]
        - title: Oklahoma City
          value: '{{okc_new_arena:short}}'
          text: >-
            For a new arena due in 2028. The Thunder's lease runs through at least 2053, with penalties of up to
            {{okc_exit_penalty}} for leaving early.
          sources: [okc-oklahoma-city-and-thunder-break-ground-on-contin, okc-okc-and-thunder-approve-agreements-to-keep-the-thu]
  more:
    - { page: leases, text: 'Every lease and its exit terms' }
    - { page: threats, text: 'All the threat episodes' }

method:
  n: 9
  title: How this was made
  nav: Method
  blocks:
    - p: >-
        Every figure comes from ledgers built from {{sources_n}} documents: {{sources_government}} from governments,
        {{sources_team}} from teams, the league or their filings, and {{sources_independent}} from news
        organizations, researchers and reference works. Each is labeled as computed, taken from a primary document,
        or taken from the press or another secondary source.
      sources: [ledger, team-ledger]
    - p: >-
        Dollars are in 2026 terms, converted with the Consumer Price Index for All Urban Consumers, not seasonally
        adjusted, on the January-August 2026 average ({{cpi_base}}). Pending deals are reported but not counted.
        Team values are Forbes's estimates of October 2026. The totals are probably low: some records could not be
        reached, among them municipal bond disclosures on EMMA. The [fact-check page](/fact-check/) lists every
        number with its sources and the corrections made during the work.
      sources: [fred-cpiaucns, ledger, team-ledger]
  more:
    - { page: fact-check, text: 'Every number and its sources' }
    - { page: sources, text: 'The documents' }
