  sources: [team-ledger]

arenas:
  path: /arenas/
  kicker: The arenas
  title: >-
    In Cash, Indianapolis's Arena Has Taken the Most Public Money
  deck: >-
    The public money in each of the {{arenas_n}} arenas, from construction to yearly payments, with every
    source. Gainbridge Fieldhouse's {{ind_public}} is {{ind_share}} of everything spent on it; counting tax
    breaks, Brooklyn's and New York's arenas have taken more.
  description: >-
    Every arena's construction, purchases, renovations, yearly payments, tax breaks and lease, with labels and
    sources.
  sources: [ledger]
  blocks:
    - p: >-
        Each arena below lists every item of public money the ledger holds, in the dollars of its year and in
        2026 dollars, with the label of the figure and its sources. Purchases count as public money but not as
        new spending, because they pay back the arena's builders. Pending money is listed but not counted.
      sources: [ledger]
    - fig: arenas
    - fig: map
    - p: >-
        Of the {{arenas_n}} arenas, {{private_built_n}} were built mainly with private money, meaning the public
        paid less than half of their construction cost. Indianapolis's arena is in neither group, because its
        records conflict on who paid to build it. {{takeover_n:cap}} of the {{private_built_n}} were later
        bought or rebuilt with public money: {{takeover_public}}, of which {{takeover_pending}} is pending,
        against {{takeover_construction_public}} of public money when they were built.
      sources: [ledger, capitalimprovementboard-cib-of-managers-of-marion-county-fs]
    - fig: takeovers

taxes:
  path: /taxes/
  kicker: The taxes
  title: >-
    Visitor Taxes Paid {{visitors_share:short}} of Public Arena Capital
  deck: >-
    The public money in NBA arenas comes from taxes on hotel rooms, car rentals and meals, and from general
    funds, sales taxes and tax increment. Here is each stream, and the records that show how the money is raised.
  description: >-
    The funding streams behind public arena money, who mostly pays each one, and the tax series behind the
    largest deals.
  sources: [ledger]
  blocks:
    - p: >-
        Every dollar of public capital money in the ledger is assigned to one funding stream, as the arena's
        records document it. Taxes residents mostly pay supplied {{residents_share}}, taxes on visitors
        {{visitors_share}}, and land, or money the records do not split among its streams, {{other_share}}.
      sources: [ledger]
    - fig: whopays
    - p: >-
        The mix has changed over time. Before 2014, visitor taxes supplied {{visitors_share_before_2014}} of the
        money; since then, taxes residents mostly pay have supplied {{residents_share_since_2014}}, led by Salt Lake
        City's arena sales tax and Washington's general fund.
      sources: [ledger]
    - fig: payershift
    - h3: Salt Lake City's arena sales tax
    - p: >-
        The {{slc_sales_tax_rate}} city sales tax that repays the bonds for the Delta Center and the blocks
        around it is reported by the Utah State Tax Commission, which publishes what it distributes to the city
        each month.
      sources: [utah-tax-distributions, utah-pmn]
    - fig: slc
    - h3: Milwaukee's district taxes
    - p: >-
        The Wisconsin Center District, which owns Fiserv Forum, collects taxes on hotel rooms, restaurant food and
        drink, and car rentals in Milwaukee County. Part of those taxes repays the district's arena bonds.
      sources: [wi-dor-expo-tax, wi-lfb-informational-paper-18]
    - fig: wcd
    - h3: Payments to teams and operators
    - fig: ongoing

tax-breaks:
  path: /tax-breaks/
  kicker: The tax breaks
  title: >-
    Madison Square Garden's Exemption Has Cost New York More Than {{nyk_exemption:title}}
  deck: >-
    Property-tax exemptions, payments in lieu of taxes and tax-exempt bonds cost the public money that never
    appears in a budget as spending. The {{tax_breaks_n}} breaks in the expanded total add {{tax_breaks_added}}
    in 2026 dollars.
  description: >-
    Every tax break found, counted or not: Madison Square Garden, Barclays Center, the United Center, Capital One
    Arena, Ball Arena and the federal cost of tax-exempt bonds.
  sources: [ledger]
  notes:
    - p: >-
        The federal cost counts only new money for the arenas. Refundings and taxable bonds are left out, and so
        is the part of Salt Lake City's 2025 bonds that pays for the district around its arena. The cost is the
        present value, at issue, of the federal income tax forgone on the bonds' interest at a {{fed_tau}}
        marginal rate, following Gayer, Drukker and Gold. Issues taken from their table are stated in 2014
        dollars and are converted to 2026 dollars from 2014; the others are converted from the year of issue. All
        U.S. taxpayers bear it, so it is not added to any city's total.
      sources: [gayer-2016, ledger]
  blocks:
    - p: >-
        The expanded total adds {{tax_breaks_added}} of breaks to the {{core_public}} of public money, all in
        2026 dollars: Barclays Center's PILOT bonds, {{bkn_pilot}} ({{bkn_pilot_issued}} when they were sold in
        2009); Madison Square Garden's exemption since 1982, more than {{nyk_exemption}}; and the United Center's
        valuation formula, {{chi_formula}} for 2002 to 2016. Breaks that are still to come, or that rest on a single
        figure that could not be checked, are listed but not added. The story counts the PILOT bonds as money to
        build Barclays Center, because they paid for its construction.
      sources: [ledger]
    - fig: uc

threats:
  path: /threats/
  kicker: The threats
  title: >-
    {{threats_same_city:cap}} of {{threats_counted}} Relocation Threats Were Followed by Public Money
  deck: >-
    A ledger of {{threat_episodes}} episodes since 1993, from explicit threats to lease clauses and other cities'
    offers, with what followed in each city.
  description: >-
    The relocation threat ledger, how threats were classified, how deals after a threat compare, and the cities
    that kept paying after a team left.
  sources: [threat-ledger]
  blocks:
    - p: >-
        An episode counts as a threat when an owner or the league tied a team's future in a city to public money,
        openly or by implication: naming another city or announcing a move, a sale to buyers who planned to move
        the team or who came from another city and made no commitment to keep it there, a sale offered with no
        limit on moving, league terms letting it buy back or move the team, talks with another city, or a lease
        clause that let the team leave. Money approved but not yet final, as in Portland, is counted as pending. Statements by
        local officials alone, and other cities' offers, are recorded but not counted as threats.
      sources: [threat-ledger]
    - fig: threats

leases:
  path: /leases/
  kicker: The leases
  title: >-
    {{leases_by_2036:cap}} NBA Leases End by 2036
  deck: >-
    The year each arena lease ends, what leaving would cost, and the deals pending or planned in Houston,
    Memphis, Portland, San Antonio, Dallas and Philadelphia, along with Oklahoma City's new arena.
  description: >-
    Lease terms, exit penalties and the pending deals, arena by arena.
  sources: [ledger]
  notes:
    - p: >-
        New arenas and districts are outside the totals for the {{arenas_n}} arenas in use, and pending money on
        current arenas is not counted until it is binding. Budgets are at face value.
      sources: [ledger]
  blocks:
    - fig: leases

households:
  path: /households/
  kicker: The households
  title: >-
    In Salt Lake City, the Arena Deal Comes to {{hh_uta}} per Household
  deck: >-
    The public money in the largest deals, divided by the households in the jurisdictions that pay.
  description: >-
    Per-household figures for the largest arena deals, the paying jurisdictions and their weights.
  sources: [ledger, census-b11001-2024]
  blocks:
    - p: >-
        Each deal's public money is split among the governments that pay it, by their documented shares, and
        divided by each one's households in the Census Bureau's 2024 American Community Survey. A household in a
        city or county also pays its share of the state's part, so the figures add.
      sources: [census-b11001-2024, ledger]
    - p: >-
        A per-household figure is a measure of scale, not a tax bill. Visitor taxes, which paid {{visitors_share}}
        of public arena capital, fall mostly on people who live elsewhere, and sales taxes fall partly on them.
      sources: [ledger]
    - fig: households

sources:
  path: /sources/
  kicker: The sources
  title: >-
    {{sources_n}} Documents, From City Audits to Team Filings
  deck: >-
    Every document this site cites, grouped by who published it: {{sources_government}} from governments,
    {{sources_court}} from a court, {{sources_team}} from teams, the league or their filings, and
    {{sources_independent}} from news organizations, researchers and reference works.
  description: >-
    The bibliography: every source, with its publisher, date and the date its figures were last checked.
  sources: [ledger]

