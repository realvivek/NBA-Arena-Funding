arenas:
  path: /arenas/
  kicker: The arenas
  title: >-
    Indianapolis's Arena Has Taken the Most Direct Public Money
  deck: >-
    The public money in each of the {{arenas_n}} arenas, from construction to yearly payments, with every
    source. Gainbridge Fieldhouse's {{ind_public}} is {{ind_share}} of everything spent on it. Counting the bonds
    Barclays Center repays with its property taxes and Madison Square Garden's tax exemption, Brooklyn's and New
    York's arenas have taken more.
  description: >-
    Every arena's construction, purchases, renovations, yearly payments, tax breaks and lease, with labels and
    sources.
  sources: [ledger]
  blocks:
    - p: >-
        Each arena below lists every item of public money the ledger holds, in the dollars of its year and in
        2026 dollars, with the label of the figure and its sources. Purchases count as public money but not as
        new spending, because they pay back the arena's builders. Pending money is listed but not counted.
      sources: [ledger]
    - fig: arenas
    - fig: map
    - p: >-
        Of the {{arenas_n}} arenas, {{private_built_n}} were built mainly with private money, meaning the public
        paid less than half of their construction cost. Barclays Center is not among them: counting the bonds its
        property taxes repay, the public paid {{bkn_build_share}} of building it. Indianapolis's arena is in neither
        group, because its records conflict on who paid to build it. {{takeover_n:cap}} of the {{private_built_n}} were later
        bought or rebuilt with public money: {{takeover_public}}, of which {{takeover_pending}} is pending,
        against {{takeover_construction_public}} of public money when they were built.
      sources: [ledger, capitalimprovementboard-cib-of-managers-of-marion-county-fs, ibo-2023-march-description-of-public-subsidies-for-m]
    - fig: takeovers

taxes:
  path: /taxes/
  kicker: The taxes
  title: >-
    Taxes Residents Mostly Pay Supplied {{residents_share:short}} of Public Arena Capital
  deck: >-
    The public money in NBA arenas comes from taxes on hotel rooms, car rentals, meals and tickets, and from
    general funds, sales taxes and tax increment. Here is each stream, and the records that show how the money is raised.
  description: >-
    The funding streams behind public arena money, who mostly pays each one, and the tax series behind the
    largest deals.
  sources: [ledger]
  blocks:
    - p: >-
        Every dollar of public capital money in the ledger is assigned to one funding stream, as the arena's
        records document it. Taxes residents mostly pay supplied {{residents_share}}; hotel and car-rental taxes,
        which fall mostly on visitors, {{visitors_share}}; taxes on restaurant meals and tickets, alone or pooled
        with hotel taxes, which visitors and residents share, {{shared_share}}; and land, or money the records do
        not split among its streams, {{other_share}}. No study of who bears these taxes for these arenas was
        found, so the split shows who mostly pays, not an exact incidence.
      sources: [ledger]
    - fig: whopays
    - p: >-
        The mix has changed over time. Before 2014, hotel and car-rental taxes supplied
        {{visitors_share_before_2014}} of the money; since then, taxes residents mostly pay have supplied {{residents_share_since_2014}}, led by Salt Lake
        City's arena sales tax and Washington's general fund.
      sources: [ledger]
    - fig: payershift
    - h3: Salt Lake City's arena sales tax
    - p: >-
        The {{slc_sales_tax_rate}} city sales tax that repays the bonds for the Delta Center and the blocks
        around it is reported by the Utah State Tax Commission, which publishes what it distributes to the city
        each month.
      sources: [utah-tax-distributions, utah-pmn]
    - fig: slc
    - h3: Milwaukee's district taxes
    - p: >-
        The Wisconsin Center District, which owns Fiserv Forum, collects taxes on hotel rooms, restaurant food and
        drink, and car rentals in Milwaukee County. Part of those taxes repays the district's arena bonds.
      sources: [wi-dor-expo-tax, wi-lfb-informational-paper-18]
    - fig: wcd
    - h3: Payments to teams and operators
    - fig: ongoing

tax-breaks:
  path: /tax-breaks/
  kicker: The tax breaks
  title: >-
    Madison Square Garden's Exemption Has Cost New York More Than {{nyk_exemption:title}}
  deck: >-
    Property-tax exemptions, payments in lieu of taxes and tax-exempt bonds cost the public money that never
    appears in a budget as spending. The {{tax_breaks_n}} breaks in the expanded total add {{tax_breaks_added}}
    in 2026 dollars.
  description: >-
    Every tax break valued, counted or not: Madison Square Garden, Barclays Center, the United Center, Capital One
    Arena, Ball Arena and the federal cost of tax-exempt bonds.
  sources: [ledger]
  notes:
    - p: >-
        The federal cost counts only new money for the arenas. Refundings and taxable bonds are left out, and so
        is the part of Salt Lake City's 2025 bonds that pays for the district around its arena. The cost is the
        present value, at issue, of the federal income tax forgone on the bonds' interest at a {{fed_tau}}
        marginal rate. For the {{fed_gdg_issues_n}} issues in Gayer, Drukker and Gold's data it is their published value, in 2014
        dollars, converted to 2026 dollars; for later issues it is an approximation that probably overstates the
        cost, converted from the year of issue. {{fed_bond_cost_unconfirmed:cap}} of it rests on issues whose
        tax-exempt status is not confirmed. All U.S. taxpayers bear it, so it is not added to any city's total.
      sources: [gayer-2016, ledger]
  blocks:
    - p: >-
        The expanded total adds {{tax_breaks_added}} of breaks to the {{core_public}} of public money, all in
        2026 dollars: Barclays Center's PILOT bonds, {{bkn_pilot}} ({{bkn_pilot_issued}} when they were sold in
        2009); Madison Square Garden's exemption, which dates to 1982, more than {{nyk_exemption}} for fiscal 1984
        to 2026; and the United Center's
        valuation formula, {{chi_formula}} for 2002 to 2016. Breaks that are still to come, or that rest on a single
        figure that could not be checked, are listed but not added. The story counts the PILOT bonds as money to
        build Barclays Center, because they paid for its construction.
      sources: [ledger]
    - p: >-
        Publicly owned arenas pay no property tax, and the ledger does not add that forgone tax to any total. It is
        about {{phi_exemption_annual}} a year for Philadelphia's arena, on property the city owns of record, and
        about {{por_ptax_forgone}} a year for Portland's since the city bought it in 2024. Barclays Center's
        payments in lieu of tax, {{bkn_pilot_2023}} in 2023, were also less than the {{bkn_wouldbe_2023}} of tax it
        would have owed.
      sources: [ledger, ibo-2023-march-description-of-public-subsidies-for-m]
    - fig: uc

threats:
  path: /threats/
  kicker: The threats
  title: >-
    Public Money Followed {{threats_same_city}} of {{threats_counted}} Relocation Threats. It Came {{nothreat_deals_n}} Times Without One.
  deck: >-
    A ledger of {{threat_episodes}} entries from 1990 to 2026, from explicit threats to lease clauses, other
    cities' offers and the teams with no threat found, with what followed in each city. Deals that followed a
    threat were not larger or more one-sided than deals without one.
  description: >-
    The relocation threat ledger, how threats were classified, how deals after a threat compare, and the cities
    that kept paying after a team left.
  sources: [threat-ledger]
  blocks:
    - p: >-
        An episode counts as a threat when an owner or the league tied a team's future in a city to public money,
        openly or by implication: naming another city or announcing a move, a sale to buyers who planned to move
        the team or who came from another city and made no commitment to keep it there, a sale offered with no
        limit on moving, league terms letting it buy back or move the team, talks with another city, or a lease
        clause that let the team leave. Money approved but not yet final, as in Portland, is counted as pending. Statements by
        local officials alone, and other cities' offers, are recorded but not counted as threats.
      sources: [threat-ledger]
    - p: >-
        A threat is not what separates the deals. Over the same years, {{nothreat_deals_n}} deals with public money
        for NBA arenas came with no threat on record. The median public share was {{threat_median_share}} after a threat and
        {{nothreat_median_share}} without one, and the median public money {{threat_median_public}} against
        {{nothreat_median_public}}. In samples this small, neither gap can be told apart from chance (p =
        {{p_share}} for the share and {{p_dollars}} for the money, Mann-Whitney test).
      sources: [threat-ledger]
    - fig: threats

leases:
  path: /leases/
  kicker: The leases
  title: >-
    {{leases_by_2036:cap}} NBA Leases End by 2036
  deck: >-
    The year each arena lease ends, what leaving would cost, and the deals pending or planned in Houston,
    Memphis, Portland, San Antonio, Dallas and Philadelphia, along with Oklahoma City's new arena.
  description: >-
    Lease terms, exit penalties and the pending deals, arena by arena.
  sources: [ledger]
  notes:
    - p: >-
        New arenas and districts are outside the totals for the {{arenas_n}} arenas in use, and pending money on
        current arenas is not counted until it is binding. Budgets are at face value.
      sources: [ledger]
  blocks:
    - fig: leases

households:
  path: /households/
  kicker: The households
  title: >-
    In Salt Lake City, the Arena Deal Comes to as Much as {{hh_uta}} per Household
  deck: >-
    The public money in each of the {{hh_deals_n}} arena deals that took it, divided by the households in the
    governments that pay. Salt Lake City's figure is an upper bound, because people who live elsewhere pay part of
    its sales tax.
  description: >-
    Per-household figures for every arena deal with public money, the paying governments and their shares, and a
    lookup by ZIP code.
  sources: [ledger, census-b11001-2024]
  blocks:
    - lookup: zip
      title: Look up a ZIP code
      intro: >-
        See the public money committed to NBA arenas by the city, county and state that tax a ZIP code, per
        household. The lookup covers {{zip_areas_n}} ZIP code areas.
      sources: [ledger, census-b11001-2024, census-zcta-county-2020, census-zcta-place-2020]
    - p: >-
        Each deal's public money is split among the governments that pay it, by their documented shares, and
        divided by each one's households in the Census Bureau's 2024 American Community Survey. A household in a
        city or county also pays its share of the state's part, so the figures add.
      sources: [census-b11001-2024, ledger]
    - p: >-
        A per-household figure is a measure of scale, not a tax bill. Hotel and car-rental taxes, which paid
        {{visitors_share}} of public arena capital, fall mostly on people who live elsewhere, and sales, meal and
        ticket taxes fall partly on them.
      sources: [ledger]
    - fig: households

sources:
  path: /sources/
  kicker: The sources
  title: >-
    {{sources_n}} Documents, From City Audits to Team Filings
  deck: >-
    Every document this site cites, grouped by who published it: {{sources_government}} from governments,
    {{sources_court}} from a court, {{sources_team}} from teams, the league or their filings, and
    {{sources_independent}} from news organizations, researchers and reference works.
  description: >-
    The bibliography: every source, with its publisher, date and the date its figures were last checked.
  sources: [ledger]

fact-check:
