# Heads and copy for the story and the reference pages. Titles state the page's finding. Numbers are tokens
# from pipeline/stats.yaml; text fields are folded block scalars (>-).

home:
  path: /
  kicker: Public money and NBA arenas
  title: >-
    Taxpayers Have Put or Committed {{expanded_public:title}} to the NBA's Arenas. Owners Kept the Gains.
  deck: >-
    A review of the public money and tax breaks behind every arena in the league: what governments paid, through which taxes, who
    gained as team values soared, and which deals come next.
  description: >-
    Who paid for the NBA's arenas, through which taxes, who gains as team values rise, and what the public gets
    back.
  sources: [ledger, team-ledger]
  # What we found, under the head: one line per finding, each pointing to the section of story.yaml that holds it
  findings:
    - p: >-
        Governments have put or committed **{{expanded_public}}** in public money and tax breaks to the
        {{arenas_n}} arenas, and {{after_opening_share}} of it came, or is committed, after the arenas opened.
      to: bill
      sources: [ledger]
    - p: >-
        The {{value_group_n}} least valuable teams play in arenas holding **{{value_bottom10_public}}** of public
        money, against {{value_top10_public}} for the {{value_group_n}} most valuable.
      to: teams
      sources: [ledger, team-ledger]
    - p: >-
        Since 2014, renovating or buying arenas that already stand has drawn **{{rebuild_ratio}} times** as much
        public money as building new ones, counting Oklahoma City's arena under construction.
      to: rebuild
      sources: [ledger]
    - p: >-
        Since 2014, taxes residents mostly pay have supplied **{{residents_share_since_2014}}** of the public money
        to build, renovate and buy the arenas, up from {{residents_share_before_2014}} before, and
        {{unvoted_since_2014_share}} of it was approved with no public vote. Sales taxes like Salt Lake City's take
        about {{itep_ut_sales_ratio}} times as large a share of income from Utah's poorest fifth of households as from
        its richest one percent.
      to: pays
      sources: [ledger, threat-ledger, itep-who-pays-7]
    - p: >-
        The average team is worth **{{value_mean_2026}}**, {{value_growth_2014}} times the 2014 average before
        inflation. None of the {{public_deals_read}} public arena deals whose terms could be read gives the public a
        share when a team is sold.
      to: gains
      sources: [team-ledger]
    - p: >-
        Owners from finance or investment funds reach **{{finance_teams_n}}** of the {{arenas_n}} teams, and the
        league itself receives a share of one fund's fees.
      to: behind
      sources: [team-ledger, sec-owl-20251231]
    - p: >-
        Of the current arena leases, **{{leases_by_2036}}** end by 2036. After {{threats_same_city}} of the
        {{threats_counted}} relocation threats documented since 1994, public money followed in the same city, but
        deals that came with no threat were no smaller and no less one-sided.
      to: next
      sources: [threat-ledger, ledger]

who-is-behind:
  path: /who-is-behind/
  kicker: The investigation
  title: >-
    Who Is Behind the NBA's Arena Deals
  deck: >-
    Owners from finance and investment funds now reach {{finance_teams_n}} of the {{arenas_n}} teams. People with
    money at stake help make the arena deals, federal tax breaks add a second layer of subsidy, and none of the
    {{public_deals_read}} public deals whose terms could be read gives the public a share when a team is sold.
  description: >-
    The investment funds and owners from finance in NBA teams, the people around the arena deals, the reporting
    that exposed owners' taxes and side deals, the federal tax breaks, and what would change the math.
  sources: [team-ledger]
  tiles:
    - value: '{{funds_n:short}}'
      label: investment funds with stakes in {{fund_teams_n}} teams or their parent companies
    - value: '{{owners_finance_n}}'
      label: of the {{arenas_n}} controlling owners made their money mainly in finance
    - value: '{{finance_teams_public:short}}'
      label: >-
        in public money for the arenas of the {{finance_teams_n}} teams they reach, {{finance_teams_share}} of the
        total, about their share of the league
    - value: '{{fed_bond_cost:short}}'
      label: in federal income tax forgone on the tax-exempt bonds sold for the arenas
  blocks:
    - h3: The funds in the teams
    - p: >-
        Since 2021 the league has let investment funds buy into teams: up to {{nba_fund_cap_single}} of a team for
        one fund and {{nba_fund_cap_total}} for all funds together, and since December 2025 in up to
        {{nba_fund_teams_max}} teams per fund. League rules give the stakes no governance rights, though Arctos
        reportedly took board seats with its Kings stake, and no record found places a fund at an arena negotiation.
      sources: [cliffordchance-2026-1-from-five-to-eight-nba-further-loosens, frontofficesports-the-nbas-expanding-private-equity-footprin, frontofficesports-arctos-to-buy-17-stake-in-kings-at-1-8b-va]
    - funds:
        - fund: Arctos Sports Partners
          text: KKR, one of the largest private equity firms, bought the company that manages Arctos in May 2026.
          sources: [sec-kkr-20260630]
        - fund: Blue Owl HomeCourt
          text: >-
            The league's partner fund. Blue Owl's annual report says the NBA "receives a share of management fees and
            incentive allocations" from it.
          sources: [sec-owl-20251231]
        - fund: Qatar Investment Authority
          text: Qatar's sovereign wealth fund, a partner in the Wizards' parent company since 2023.
          sources: [wsls-qatar-investment-authority-is-buying-a-stake-in]
        - fund: Sixth Street
          text: >-
            Also the majority owner of Legends, whose CSL International studied San Antonio's arena district and
            whose ASM Global runs Oklahoma City's arena.
          sources: [sacurrent-csl-legends-2025, pollstar-asm-okc-2025]
    - h3: The owners
    - p: >-
        {{owners_finance_n:cap}} of the {{arenas_n}} controlling owners made their money mainly in finance,
        {{owners_pe_n}} of them in private equity or hedge funds. {{control_sales_2015_finance_n:cap}} of the
        {{control_sales_2015_n}} sales of control since 2015 went to buyers from finance, against
        {{control_sales_pre2015_finance_n}} of the {{control_sales_pre2015_n}} earlier sales to today's owners. Of
        the public money in the arenas of the teams they reach, {{finance_teams_after}}, or
        {{finance_teams_after_share}}, was counted after the current finance owner or fund arrived.
      sources: [team-ledger]
    - fig: owners
    - h3: Finance money came before the latest public deal
    - cards:
        - title: San Antonio
          value: 2021, then 2025
          text: Sixth Street bought into the Spurs in 2021. Bexar County voters approved arena money in 2025.
          sources: [ksat-spurs-name-peter-j-holt-managing-partner-add-aus, ledger]
        - title: Salt Lake City
          value: 2022, then 2024
          text: Arctos bought into the Jazz's parent company in 2022. Utah passed its arena law in 2024.
          sources: [sltrib-miller-family-sells-some-its, ledger]
        - title: Washington
          value: 2023, then 2024
          text: Qatar's fund bought into the Wizards' parent company in 2023, the year before the District's deal.
          sources: [wsls-qatar-investment-authority-is-buying-a-stake-in, ledger]
        - title: Charlotte
          value: 2019, then 2022
          text: >-
            Hedge-fund founders Gabe Plotkin and Daniel Sundheim bought into the Hornets in 2019, before the city's
            2022 arena deal. Plotkin and Rick Schnall took control in 2023.
          sources: [nba-jordan-hornets-new-partners-retains-majority-off, news4jax-michael-jordans-sale-of-majority-ownership-of-ho, ledger]
    - p: >-
        Elsewhere the funds bought in after the latest public money was approved, or the arena has none. No record
        found links a fund to the negotiations, so the timing shows who stood to gain, not who made the deals.
      sources: [team-ledger, ledger]
    - h3: The people around the deals
    - stats:
        - value: '{{threats_same_city}} of {{threats_counted}}'
          label: >-
            relocation threats by owners or the league since 1994 were followed by public money in the same city,
            {{lag_within_24}} of them within {{lag_window}} months
      sources: [threat-ledger]
    - cards:
        - title: Lobbying in Portland
          value: '{{por_lobbying}}'
          text: >-
            Reported by the Trail Blazers' arena company in the 2026 session that produced up to {{por_state}} of
            state bonds for its arena.
          sources: [olis-enrolled, opb-trail-blazers-moda-center-portland-basketball-sp]
        - title: A study in San Antonio
          text: >-
            The city's study of the new arena district came from CSL International, a subsidiary of Legends, whose
            majority owner, Sixth Street, is an investor in the Spurs.
          sources: [sacurrent-csl-legends-2025]
        - title: An operator in Oklahoma City
          text: >-
            Legends, through ASM Global, runs the city's publicly owned arena under a contract that extends to the new
            one.
          sources: [pollstar-asm-okc-2025]
    - h3: What the reporting found
    - p: >-
        We found no Pulitzer for an investigation of an arena deal, though the Pulitzer site could not be searched
        directly. The nearest is this year's prize for audio
        reporting, to the podcast Pablo Torre Finds Out, for showing how money reached Kawhi Leonard through
        Aspiration, a company Steve Ballmer had invested in.
      sources: [news4jax-pablo-torres-podcast-wins-pulitzer-prize-for-cli]
    - cards:
        - title: The league's finding
          value: '{{lac_fine:short}} fine'
          text: >-
            The NBA found the Clippers induced companies doing business with the team to pay Leonard "by offering them
            business from the team." It took {{lac_picks}} first-round picks and suspended Ballmer for a year.
          sources: [pr-nba-investigation-clippers-kawhi-leonard]
        - title: The tax playbook
          text: >-
            ProPublica's 2021 "Billionaire Playbook," drawn from IRS records, showed how owners use their teams to cut
            taxes on their other income.
          sources: [propublica-billionaire-playbook]
    - h3: The federal layer
    - stats:
        - value: '{{fed_bond_cost:short}}'
          label: in federal income tax forgone on interest from the tax-exempt bonds sold for the arenas
        - value: '{{sec197_years}} years'
          label: over which a buyer deducts most of the purchase price of a team
      sources: [gayer-2016]
    - p: >-
        In 2025 the House voted to halve that deduction for sports teams; the committee report said "the owners of
        sports teams unfairly benefit." The change was left out of the law that passed.
      sources: [govinfo-crpt-119hrpt106-pt2, hr1-engrossed-2025, hr1-enrolled-2025]
    - h3: What would change the math
    - p: >-
        Economists who reviewed more than {{research_studies}} studies over {{research_years}} years of research found
        "very limited economic impacts of professional sports teams and stadiums." A city that pays anyway can ask
        for what the NBA deals reviewed here do not have.
      sources: [bradbury-2023]
    - cards:
        - title: A share of the sale
          value: up to {{vikings_public_share}}
          text: >-
            Of the gain when the team is sold, as Minnesota wrote into its law for the Vikings. The Broncos' stadium
            lease paid {{broncos_sale_share}} to the Denver stadium district for youth programs when the team was sold
            in 2022; the buyers took over the lease without that clause.
          sources: [revisor-473j-15, cbsnews-broncos-sale-help-youth-programs-denver-metro-ar]
        - title: Rent that grows
          text: >-
            Rent that rises with the team's value, instead of a per-game fee like Oklahoma City's, capped at
            {{okc_fee_cap}} a year.
          sources: [okc-pbcarena-use-license-agreementfinal-6-12-25-1]
        - title: Disclosure
          text: >-
            Disclosure of the contractors, sponsors and consultants that work for both the team and the arena's public
            owner.
          sources: [team-ledger]

